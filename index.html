      <tbody>${pRows}</tbody></table></div>
  `;
}

/* 기믹 탭 차트 렌더링 */
function renderGimmickCharts(gameId, stages) {
  const pAgg = _aggregatePersonaStages(stages);
  const pKeys = Object.keys(pAgg).sort((a,b) => (PERSONA_ORDER.indexOf(a)===-1?99:PERSONA_ORDER.indexOf(a)) - (PERSONA_ORDER.indexOf(b)===-1?99:PERSONA_ORDER.indexOf(b)));
  const labels = pKeys.map(p => PERSONA_KO[p] || p);
  const colors = pKeys.map(p => PERSONA_COLORS[p] || '#999');

  // 기믹·플러스카드/판
  const gimmickPerGame = pKeys.map(p => pAgg[p].played ? +(pAgg[p].gimmicks / pAgg[p].played).toFixed(2) : 0);
  const plusPerGame = pKeys.map(p => pAgg[p].played ? +(pAgg[p].plusCards / pAgg[p].played).toFixed(2) : 0);
  const gKey = `gimmick-${gameId}`;
  if (_charts[gKey]) _charts[gKey].destroy();
  const gCanvas = document.getElementById(`chart-gimmick-${gameId}`);
  if (gCanvas) {
    _charts[gKey] = new Chart(gCanvas, {
      type: 'bar',
      data: { labels, datasets: [
        { label: '기믹 배치 종류/판', data: gimmickPerGame, backgroundColor: '#f59e0b99', borderColor: '#f59e0b', borderWidth: 1.5, borderRadius: 4 },
        { label: '플러스카드/판', data: plusPerGame, backgroundColor: '#8b5cf699', borderColor: '#8b5cf6', borderWidth: 1.5, borderRadius: 4 },
      ]},
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8' } } } },
    });
  }

  // 기믹 타입별 배치 맵 수
  const allGTypes = {};
  for (const p of pKeys) {
    for (const [k, v] of Object.entries(pAgg[p].gimmickTypes)) {
      allGTypes[k] = (allGTypes[k] || 0) + v;
    }
  }
  const gtKeys = Object.keys(allGTypes).sort((a, b) => allGTypes[b] - allGTypes[a]);
  const gtLabels = gtKeys.map(k => GIMMICK_NAMES[k] || `타입${k}`);
  const gtData = gtKeys.map(k => allGTypes[k]);
  const gtColors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];

  const gtKey = `gtype-${gameId}`;
  if (_charts[gtKey]) _charts[gtKey].destroy();
  const gtCanvas = document.getElementById(`chart-gtype-${gameId}`);
  if (gtCanvas) {
    _charts[gtKey] = new Chart(gtCanvas, {
      type: 'bar',
      data: { labels: gtLabels, datasets: [{ label: '배치 맵 수', data: gtData, backgroundColor: gtColors.slice(0, gtKeys.length), borderRadius: 4 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } },
    });
  }

  // 기믹 타입별 비율 (도넛)
  const gpKey = `gpie-${gameId}`;
  if (_charts[gpKey]) _charts[gpKey].destroy();
  const gpCanvas = document.getElementById(`chart-gpie-${gameId}`);
  if (gpCanvas) {
    _charts[gpKey] = new Chart(gpCanvas, {
      type: 'doughnut',
      data: { labels: gtLabels, datasets: [{ data: gtData, backgroundColor: gtColors.slice(0, gtKeys.length) }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'right', labels: { color: '#94a3b8' } } },
      },
    });
  }

  // 기믹 보유율 (페르소나별)
  const grKey = `grate-${gameId}`;
  if (_charts[grKey]) _charts[grKey].destroy();
  const grCanvas = document.getElementById(`chart-grate-${gameId}`);
  if (grCanvas) {
    const grData = pKeys.map(p => pAgg[p].played ? +(pAgg[p].gimmicks / pAgg[p].played * 100).toFixed(1) : 0);
    _charts[grKey] = new Chart(grCanvas, {
      type: 'bar',
      data: { labels, datasets: [{ label: '기믹 등장률 (%)', data: grData, backgroundColor: colors.map(c => c + '99'), borderColor: colors, borderWidth: 1.5, borderRadius: 4 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } },
        plugins: { legend: { display: false } },
      },
    });
  }
}

/* ══════════════════════════════════════════════
   카테고리: 타일 (CTZ 전용)
   ══════════════════════════════════════════════ */
function renderCatTiles(gameId, stages, runs) {
  const totalStages = stages.length;
  if (!totalStages) return '<div style="color:var(--text-muted);padding:20px">타일 데이터 없음 — 프리플레이를 실행하면 표시됩니다</div>';

  let totalScore = 0, totalContinues = 0, totalTiles = 0, totalClicks = 0;
  const slotData = { clearUsed: [], failUsed: [] };
  const tileKindCounts = {};

  for (const s of stages) {
    const d = s.details || {};
    totalScore += d.score || 0;
    totalContinues += d.continues || 0;
    totalTiles += d.tiles_cleared || 0;
    totalClicks += d.total_clicks || 0;
    if (d.slots_used != null) {
      (s.result === 'clear' ? slotData.clearUsed : slotData.failUsed).push(d.slots_used);
    }
    if (d.tile_kinds != null) {
      const k = String(d.tile_kinds);
      tileKindCounts[k] = (tileKindCounts[k] || 0) + 1;
    }
  }

  const avgScore = totalStages ? Math.round(totalScore / totalStages) : 0;
  const avgTiles = totalStages ? Math.round(totalTiles / totalStages) : 0;

  return `
    <div class="metric-row">
      <div class="metric-box"><div class="label">평균 점수</div><div class="value">${avgScore.toLocaleString()}</div></div>
      <div class="metric-box"><div class="label">이어하기 횟수</div><div class="value">${totalContinues}</div></div>
      <div class="metric-box"><div class="label">평균 타일 수</div><div class="value">${avgTiles}</div></div>
      <div class="metric-box"><div class="label">총 클릭</div><div class="value">${totalClicks.toLocaleString()}</div></div>
      <div class="metric-box"><div class="label">총 판수</div><div class="value">${totalStages}</div></div>
    </div>
    <div class="chart-grid">
      <div class="chart-box"><h4>타일 종류 수 분포</h4><canvas id="chart-tilekind-${gameId}"></canvas></div>
      <div class="chart-box"><h4>슬롯 사용량 분포</h4><canvas id="chart-slot-${gameId}"></canvas></div>
    </div>
  `;
}

function renderTileCharts(gameId, stages, runs) {
  const tileKindCounts = {};
  const slotClear = [], slotFail = [];
  for (const s of stages) {
    const d = s.details || {};
    if (d.tile_kinds != null) {
      const k = String(d.tile_kinds);
      tileKindCounts[k] = (tileKindCounts[k] || 0) + 1;
    }
    if (d.slots_used != null) {
      (s.result === 'clear' ? slotClear : slotFail).push(d.slots_used);
    }
  }

  // 타일 종류 수 분포 (막대)
  const tkKeys = Object.keys(tileKindCounts).sort((a, b) => +a - +b);
  const tkColors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'];
  const tkKey = `tilekind-${gameId}`;
  if (_charts[tkKey]) _charts[tkKey].destroy();
  const tkCanvas = document.getElementById(`chart-tilekind-${gameId}`);
  if (tkCanvas && tkKeys.length) {
    _charts[tkKey] = new Chart(tkCanvas, {
      type: 'bar',
      data: { labels: tkKeys.map(k => k + '종'), datasets: [{ label: '판 수', data: tkKeys.map(k => tileKindCounts[k]), backgroundColor: tkColors.slice(0, tkKeys.length).map(c => c + '99'), borderColor: tkColors.slice(0, tkKeys.length), borderWidth: 1.5, borderRadius: 6 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } },
    });
  }

  // 슬롯 사용량 분포
  const slotKey = `slot-${gameId}`;
  if (_charts[slotKey]) _charts[slotKey].destroy();
  const slotCanvas = document.getElementById(`chart-slot-${gameId}`);
  if (slotCanvas && (slotClear.length || slotFail.length)) {
    const maxSlot = Math.max(...slotClear, ...slotFail, 0);
    const slotLabels = Array.from({ length: maxSlot + 1 }, (_, i) => String(i));
    const clearBins = new Array(maxSlot + 1).fill(0);
    const failBins = new Array(maxSlot + 1).fill(0);
    slotClear.forEach(v => { if (v <= maxSlot) clearBins[v]++; });
    slotFail.forEach(v => { if (v <= maxSlot) failBins[v]++; });
    _charts[slotKey] = new Chart(slotCanvas, {
      type: 'bar',
      data: { labels: slotLabels, datasets: [
        { label: '클리어', data: clearBins, backgroundColor: '#10b98199', borderColor: '#10b981', borderWidth: 1, borderRadius: 3 },
        { label: '실패', data: failBins, backgroundColor: '#ef444499', borderColor: '#ef4444', borderWidth: 1, borderRadius: 3 },
      ]},
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8' } } } },
    });
  }
}

/* ══════════════════════════════════════════════
   카테고리: 아이템 (CTZ 전용)
   ══════════════════════════════════════════════ */
function renderCatCtzItems(gameId, stages, runs) {
  let undo = 0, shuffle = 0, magnet = 0, continues = 0;
  const byPersona = {};

  for (const s of stages) {
    const d = s.details || {};
    const items = d.items_used || {};
    undo += items.undo || 0;
    shuffle += items.shuffle || 0;
    magnet += items.magnet || 0;
    continues += d.continues || 0;

    const p = s.persona;
    if (!byPersona[p]) byPersona[p] = { undo: 0, shuffle: 0, magnet: 0, continues: 0, levels: 0 };
    byPersona[p].undo += items.undo || 0;
    byPersona[p].shuffle += items.shuffle || 0;
    byPersona[p].magnet += items.magnet || 0;
    byPersona[p].continues += d.continues || 0;
    byPersona[p].levels++;
  }

  const pRows = Object.entries(byPersona).sort(([a],[b]) => (PERSONA_ORDER.indexOf(a)===-1?99:PERSONA_ORDER.indexOf(a)) - (PERSONA_ORDER.indexOf(b)===-1?99:PERSONA_ORDER.indexOf(b))).map(([p, d]) =>
    `<tr><td style="color:${PERSONA_COLORS[p]||'#999'}">${PERSONA_KO[p]||p}</td>
     <td>${d.undo}</td><td>${d.shuffle}</td><td>${d.magnet}</td><td>${d.continues}</td><td>${d.levels}</td></tr>`
  ).join('');

  return `
    <div class="metric-row">
      <div class="metric-box"><div class="label">되돌리기</div><div class="value">${undo}</div></div>
      <div class="metric-box"><div class="label">셔플</div><div class="value">${shuffle}</div></div>
      <div class="metric-box"><div class="label">마그넷</div><div class="value">${magnet}</div></div>
      <div class="metric-box"><div class="label">이어하기</div><div class="value">${continues}</div></div>
    </div>
    <div class="tbl-wrap"><h4>페르소나별 아이템 사용</h4>
      <table><thead><tr><th>페르소나</th><th>되돌리기</th><th>셔플</th><th>마그넷</th><th>이어하기</th><th>총 판수</th></tr></thead>
      <tbody>${pRows || '<tr><td colspan="6" style="color:var(--text-muted)">데이터 없음</td></tr>'}</tbody></table></div>
  `;
}

/* ══════════════════════════════════════════════
   카테고리: 소요시간 분석 (CTZ 전용)
   ══════════════════════════════════════════════ */
function renderCatTimeAnalysis(gameId, stages, runs) {
  const byDiff = {};
  const byStageNum = {};

  for (const s of stages) {
    const d = s.details || {};
    const t = s.time_sec || 0;
    const diff = s.difficulty || 0;

    if (!byDiff[diff]) byDiff[diff] = { times: [], count: 0 };
    byDiff[diff].times.push(t);
    byDiff[diff].count++;

    const st = s.stage_number || '?';
    if (!byStageNum[st]) byStageNum[st] = { times: [], level: s.game_level };
    byStageNum[st].times.push(t);
  }

  const diffRows = Object.entries(byDiff).sort(([a],[b]) => +a - +b).map(([d, v]) => {
    const avg = v.times.length ? (v.times.reduce((a,b) => a+b, 0) / v.times.length).toFixed(1) : '-';
    const max = v.times.length ? Math.max(...v.times).toFixed(1) : '-';
    return `<tr><td>${DIFF_TIERS[d] || 'Tier '+d}</td><td>${v.count}</td><td>${avg}초</td><td>${max}초</td></tr>`;
  }).join('');

  return `
    <div class="chart-grid">
      <div class="chart-box"><h4>난이도별 평균 소요시간</h4><canvas id="chart-timediff-${gameId}"></canvas></div>
      <div class="chart-box"><h4>스테이지별 소요시간 추이</h4><canvas id="chart-timestage-${gameId}"></canvas></div>
    </div>
    <div class="tbl-wrap"><h4>난이도별 소요시간 상세</h4>
      <table><thead><tr><th>난이도</th><th>판수</th><th>평균</th><th>최대</th></tr></thead>
      <tbody>${diffRows || '<tr><td colspan="4" style="color:var(--text-muted)">데이터 없음</td></tr>'}</tbody></table></div>
  `;
}

function renderTimeCharts(gameId, stages, runs) {
  const byDiff = {};
  const byStageNum = {};

  for (const s of stages) {
    const t = s.time_sec || 0;
    const diff = s.difficulty || 0;
    if (!byDiff[diff]) byDiff[diff] = { times: [] };
    byDiff[diff].times.push(t);

    const st = s.stage_number || '?';
    if (!byStageNum[st]) byStageNum[st] = { times: [], level: s.game_level };
    byStageNum[st].times.push(t);
  }

  // 난이도별 평균 소요시간
  const diffKeys = Object.keys(byDiff).sort((a, b) => +a - +b);
  const diffLabels = diffKeys.map(d => DIFF_TIERS[d] || 'Tier ' + d);
  const diffAvgs = diffKeys.map(d => {
    const ts = byDiff[d].times;
    return ts.length ? +(ts.reduce((a,b) => a+b, 0) / ts.length).toFixed(1) : 0;
  });
  const diffColors = diffKeys.map(d => DIFF_COLORS[d] || '#999');

  const tdKey = `timediff-${gameId}`;
  if (_charts[tdKey]) _charts[tdKey].destroy();
  const tdCanvas = document.getElementById(`chart-timediff-${gameId}`);
  if (tdCanvas && diffKeys.length) {
    _charts[tdKey] = new Chart(tdCanvas, {
      type: 'bar',
      data: { labels: diffLabels, datasets: [{ label: '평균 소요시간 (초)', data: diffAvgs, backgroundColor: diffColors.map(c => c + '99'), borderColor: diffColors, borderWidth: 1.5, borderRadius: 4 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } },
    });
  }

  // 스테이지별 소요시간 추이
  const stageKeys = Object.keys(byStageNum).sort((a, b) => {
    const la = byStageNum[a].level || 0, lb = byStageNum[b].level || 0;
    return la - lb;
  });
  const stageLabels = stageKeys.map(st => `${st}`);
  const stageAvgs = stageKeys.map(st => {
    const ts = byStageNum[st].times;
    return ts.length ? +(ts.reduce((a,b) => a+b, 0) / ts.length).toFixed(1) : 0;
  });

  const tsKey = `timestage-${gameId}`;
  if (_charts[tsKey]) _charts[tsKey].destroy();
  const tsCanvas = document.getElementById(`chart-timestage-${gameId}`);
  if (tsCanvas && stageKeys.length) {
    _charts[tsKey] = new Chart(tsCanvas, {
      type: 'line',
      data: { labels: stageLabels, datasets: [{ label: '평균 소요시간 (초)', data: stageAvgs, borderColor: '#3b82f6', backgroundColor: '#3b82f622', tension: 0.3, fill: true }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 20 } }, y: { beginAtZero: true } } },
    });
  }
}

/* ══════════════════════════════════════════════
   카테고리: 스테이지 (CTZ 전용)
   ══════════════════════════════════════════════ */
function renderCatStagesCTZ(gameId, stages) {
  const byStage = {};
  for (const s of stages) {
    const key = s.stage_number || s.game_level || '?';
    if (!byStage[key]) byStage[key] = { played: 0, times: [], level: s.game_level, scores: [], slotsUsed: [], tileKinds: [], continues: 0, difficulty: s.difficulty || 0, personas: new Set() };
    const v = byStage[key];
    v.played++;
    if (s.persona) v.personas.add(s.persona);
    if (s.time_sec) v.times.push(s.time_sec);
    const d = s.details || {};
    if (d.score != null) v.scores.push(d.score);
    if (d.slots_used != null) v.slotsUsed.push(d.slots_used);
    if (d.tile_kinds != null) v.tileKinds.push(d.tile_kinds);
    v.continues += d.continues || 0;
    if (s.difficulty) v.difficulty = s.difficulty;
  }
  const rows = Object.entries(byStage)
    .sort(([a],[b]) => a.localeCompare(b))
    .map(([st, v]) => {
      const avgT = v.times.length ? (v.times.reduce((a,b)=>a+b,0) / v.times.length).toFixed(1) : '-';
      const avgScore = v.scores.length ? Math.round(v.scores.reduce((a,b)=>a+b,0) / v.scores.length).toLocaleString() : '-';
      const avgSlots = v.slotsUsed.length ? (v.slotsUsed.reduce((a,b)=>a+b,0) / v.slotsUsed.length).toFixed(1) : '-';
      const avgTK = v.tileKinds.length ? (v.tileKinds.reduce((a,b)=>a+b,0) / v.tileKinds.length).toFixed(0) : '-';
      const diffTier = v.difficulty || 0;
      const diffColor = diffTier === 4 ? '#ef4444' : diffTier === 3 ? '#f59e0b' : diffTier === 2 ? '#10b981' : '#64748b';
      const diffName = DIFF_TIERS[diffTier] || '-';
      const personaList = [...v.personas].join(',');
      return `<tr data-personas="${personaList}">
        <td>${st}</td><td>${v.played}</td>
        <td>${avgT}초</td><td>${avgScore}</td><td>${avgSlots}</td>
        <td>${avgTK}</td><td>${v.continues}</td>
        <td style="color:${diffColor};font-weight:600">${diffName}</td></tr>`;
    }).join('');
  const diffOptions = [...new Set(Object.values(byStage).map(v => v.difficulty))].sort();
  const diffFilterOpts = diffOptions.map(d => `<option value="${d}">${DIFF_TIERS[d] || 'Tier '+d}</option>`).join('');

  // 모드(페르소나) 필터 옵션
  const stgPersonas = [...new Set(stages.map(s => s.persona).filter(Boolean))].sort((a, b) =>
    (PERSONA_ORDER.indexOf(a)===-1?99:PERSONA_ORDER.indexOf(a)) - (PERSONA_ORDER.indexOf(b)===-1?99:PERSONA_ORDER.indexOf(b))
  );
  const personaFilterOpts = stgPersonas.map(p => `<option value="${p}">${PERSONA_KO[p] || p}</option>`).join('');

  return `
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px;padding:4px 8px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px">
      색상 규칙 — 난이도: <span style="color:#10b981">노말</span> · <span style="color:#f59e0b">하드</span> · <span style="color:#ef4444">슈퍼하드</span>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center;font-size:12px">
      <span style="color:var(--text-muted)">필터:</span>
      <select id="stg-persona-${gameId}" onchange="filterStages('${gameId}')" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text-secondary);font-size:12px">
        <option value="">전체 모드</option>${personaFilterOpts}
      </select>
      <button onclick="resetStageFilters('${gameId}')" style="padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text-muted);font-size:11px;cursor:pointer">필터 초기화</button>
    </div>
    <div class="tbl-wrap"><h4>스테이지별 상세 (${Object.keys(byStage).length}개)</h4>
      <table id="stg-table-${gameId}"><thead><tr>
        <th class="sortable" onclick="sortStageTable('${gameId}',0,'str')">스테이지</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',1,'num')">플레이</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',2,'num')">평균 시간</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',3,'num')">평균 점수</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',4,'num')">슬롯 사용</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',5,'num')">타일 종류</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',6,'num')">이어하기</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',7,'str')">난이도</th>
      </tr></thead>
      <tbody>${rows}</tbody></table></div>
  `;
}

/* ══════════════════════════════════════════════
   카테고리: 스테이지 (SCJ / 공통)
   ══════════════════════════════════════════════ */
function renderCatStages(gameId, stages) {
  if (gameId === 'CTZ') return renderCatStagesCTZ(gameId, stages);
  const byStage = {};
  for (const s of stages) {
    const key = s.stage_number || s.game_level || '?';
    if (!byStage[key]) byStage[key] = { played: 0, times: [], level: s.game_level, mapScores: [], mapDetails: [], turns: [], goldPnl: 0, difficulty: s.difficulty || 0, bets: [], personas: new Set() };
    byStage[key].played++;
    if (s.persona) byStage[key].personas.add(s.persona);
    if (s.time_sec) byStage[key].times.push(s.time_sec);
    const d = s.details || {};
    if (d.map_score != null) {
      byStage[key].mapScores.push(d.map_score);
      // events에서 기믹 타입 추출 (매칭 횟수 아닌 존재 여부)
      const detailGimmicks = new Set();
      for (const e of (d.events || [])) {
        if (typeof e !== 'string') continue;
        if (e.startsWith('gimmick_match:')) detailGimmicks.add(e.slice(14).split(' (')[0].trim());
        else if (e.startsWith('gimmick:')) detailGimmicks.add(e.slice(8).split(' (')[0].trim());
      }
      if (d.plus_card_count > 0) detailGimmicks.add('플러스카드');
      const cr = d.clear_rewards || {};
      byStage[key].mapDetails.push({
        score: d.map_score, base: d.map_score_base || 0,
        gimmick: d.gimmick_score || 0, field: d.field_total || 0,
        gimmickTypes: [...detailGimmicks],
        persona: s.persona,
        rewards: {
          coin: cr.coin || '0',
          hammer: cr.hammer || '0',
          star: cr.star || '0',
          combo: cr.combo_count || 0,
          streak: cr.streak_rewards || [],
          eventPoints: cr.event_points || [],
          eventProgress: cr.event_progress || [],
        },
        levelReward: d.level_reward || 0,
        entryFee: d.entry_fee || 0,
        goldPnl: d.gold_pnl || 0,
        betting: d.betting_multiplier || 1,
      });
    }
    if (d.turns != null) byStage[key].turns.push(d.turns);
    byStage[key].goldPnl += d.gold_pnl || 0;
    byStage[key].bets.push(d.betting_multiplier || 1);
    if (s.difficulty) byStage[key].difficulty = s.difficulty;
  }
  const rows = Object.entries(byStage)
    .sort(([,a],[,b]) => (a.level||0) - (b.level||0))
    .map(([st, v]) => {
      const avgT = v.times.length ? (v.times.reduce((a,b)=>a+b,0) / v.times.length).toFixed(1) : '-';
      const avgMS = v.mapScores.length ? Math.round(v.mapScores.reduce((a,b)=>a+b,0) / v.mapScores.length) : '-';
      const avgTurns = v.turns.length ? (v.turns.reduce((a,b)=>a+b,0) / v.turns.length).toFixed(1) : '-';
      const avgGold = v.played ? Math.round(v.goldPnl / v.played) : 0;
      const goldColor = avgGold >= 0 ? 'var(--status-ok)' : 'var(--status-err)';
      // 난이도 색상: 튜토리얼=회색, 노말=초록, 하드=노랑, 슈퍼하드=빨강
      const diffTier = v.difficulty || 0;
      const diffColor = diffTier === 4 ? '#ef4444' : diffTier === 3 ? '#f59e0b' : diffTier === 2 ? '#10b981' : '#64748b';
      const diffName = DIFF_TIERS[diffTier] || '-';
      // 맵스코어 색상: 1~700 초록, 701~900 주황, 901+ 빨강
      const msNum = typeof avgMS === 'number' ? avgMS : 0;
      const msColor = msNum >= 901 ? '#ef4444' : msNum >= 701 ? '#f59e0b' : msNum >= 1 ? '#10b981' : '#64748b';
      // 턴수 색상: 적을수록 초록(효율), 많을수록 빨강(비효율)
      const turnsNum = typeof avgTurns === 'string' ? parseFloat(avgTurns) : avgTurns;
      const turnsColor = turnsNum >= 50 ? '#ef4444' : turnsNum >= 40 ? '#f59e0b' : turnsNum >= 1 ? '#10b981' : '#64748b';
      // 맵스코어 상세 (펼치기용)
      const rowId = `ms_${gameId}_${st}`;
      const md = v.mapDetails;
      const avgBase = md.length ? Math.round(md.reduce((a,d)=>a+d.base,0)/md.length) : '-';
      const avgGimmickScore = md.length ? Math.round(md.reduce((a,d)=>a+d.gimmick,0)/md.length) : 0;
      const avgField = md.length ? Math.round(md.reduce((a,d)=>a+d.field,0)/md.length) : '-';
      // 기믹 정보: events 기반 타입 존재 + gimmick_score로 기여 점수
      const gimmickTypeSets = {};
      for (const d of md) {
        for (const name of (d.gimmickTypes || [])) {
          if (!gimmickTypeSets[name]) gimmickTypeSets[name] = 0;
          gimmickTypeSets[name]++;
        }
      }
      const gimmickStr = Object.keys(gimmickTypeSets).length
        ? Object.entries(gimmickTypeSets).map(([name, cnt]) => `${name} (${cnt}/${md.length}판)`).join(', ')
        : '없음';
      const personaList = [...v.personas].join(',');
      return `<tr style="cursor:pointer" data-personas="${personaList}" onclick="var d=document.getElementById('${rowId}');d.style.display=d.style.display==='none'?'table-row':'none'">
        <td>${st}</td><td>Lv${v.level||'?'}</td><td>${v.played}</td>
        <td>${avgT}초</td>
        <td style="color:${goldColor}">${avgGold.toLocaleString()}</td>
        <td style="color:${turnsColor};font-weight:600">${avgTurns}</td>
        <td style="color:${msColor};font-weight:600">${avgMS}</td>
        <td style="color:${diffColor};font-weight:600">${diffName}</td>
        <td>${v.bets.map(b => {const c = b>=4?'#ef4444':b>=2?'#f59e0b':'#10b981'; return `<span style="color:${c};font-weight:600">x${b}</span>`;}).join(', ')}</td></tr>
      <tr id="${rowId}" style="display:none;background:rgba(56,189,248,.04)"><td></td><td colspan="8" style="padding:8px 12px;font-size:11px;color:var(--text-muted)">
        <b>맵스코어 상세</b> (${md.length}회 플레이)<br>
        ${md.map((d, i) => {
          const gList = (d.gimmickTypes || []).join(', ');
          const gPart = gList ? ` · 기믹: ${gList}` : '';
          const gs = d.score - d.base;
          const gsStr = gs !== 0 ? ` + 기믹 ${gs >= 0 ? '+' : ''}${gs}` : '';
          const bet = d.betting || 1;
          const betColor = bet >= 4 ? '#ef4444' : bet >= 2 ? '#f59e0b' : '#10b981';
          const betStr = ` <span style="color:${betColor};font-weight:600">[x${bet}]</span>`;
          const r = d.rewards || {};
          const rewardParts = [];
          if (r.coin && r.coin !== '0') rewardParts.push(`골드 ${r.coin}`);
          if (r.hammer && r.hammer !== '0') rewardParts.push(`해머 ${r.hammer}`);
          if (r.star && r.star !== '0') rewardParts.push(`별 ${r.star}`);
          if (r.combo) rewardParts.push(`콤보 ${r.combo}`);
          if (r.streak && r.streak.length) rewardParts.push(`스트릭 ${r.streak.length}건`);
          if (r.eventPoints && r.eventPoints.length) rewardParts.push(`이벤트 ${r.eventPoints.join(',')}`);
          const rewardStr = rewardParts.length ? `<br><span style="color:#10b981">보상:</span> ${rewardParts.join(' · ')}` : '';
          const econStr = d.entryFee ? `<br><span style="color:#94a3b8">입장료 ${d.entryFee.toLocaleString()} · 손익 <span style="color:${d.goldPnl >= 0 ? '#10b981' : '#ef4444'}">${d.goldPnl >= 0 ? '+' : ''}${d.goldPnl.toLocaleString()}</span></span>` : '';
          const evtProg = (r.eventProgress || []).map(e => `${e.title}: ${e.gauge} (${e.rank || ''})`).join(', ');
          const evtStr = evtProg ? `<br><span style="color:#8b5cf6">이벤트:</span> ${evtProg}` : '';
          const scoreColor = d.score >= 901 ? '#ef4444' : d.score >= 701 ? '#f59e0b' : '#10b981';
          const pName = PERSONA_KO[d.persona] || d.persona || '';
          const pColor = PERSONA_COLORS[d.persona] || '#999';
          const pStr = pName ? `<span style="color:${pColor};font-weight:600">${pName}</span> ` : '';
          return `${i+1}회${betStr} ${pStr}: base ${d.base}${gsStr} = <b style="color:${scoreColor}">${d.score}</b> (카드 ${d.field}장${gPart})${rewardStr}${econStr}${evtStr}`;
        }).join('<br>')}
      </td></tr>`;
    }).join('');

  // 난이도 필터 옵션
  const diffOptions = [...new Set(Object.values(byStage).map(v => v.difficulty))].sort();
  const diffFilterOpts = diffOptions.map(d => `<option value="${d}">${DIFF_TIERS[d] || 'Tier '+d}</option>`).join('');

  // 모드(페르소나) 필터 옵션
  const stgPersonas = [...new Set(stages.map(s => s.persona).filter(Boolean))].sort((a, b) =>
    (PERSONA_ORDER.indexOf(a)===-1?99:PERSONA_ORDER.indexOf(a)) - (PERSONA_ORDER.indexOf(b)===-1?99:PERSONA_ORDER.indexOf(b))
  );
  const personaFilterOpts = stgPersonas.map(p => `<option value="${p}">${PERSONA_KO[p] || p}</option>`).join('');

  return `
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px;padding:4px 8px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px">
      색상 규칙 — 난이도: <span style="color:#10b981">노말</span> · <span style="color:#f59e0b">하드</span> · <span style="color:#ef4444">슈퍼하드</span>
      &nbsp;|&nbsp; 맵스코어: <span style="color:#10b981">1~700</span> · <span style="color:#f59e0b">701~900</span> · <span style="color:#ef4444">901+</span>
      &nbsp;|&nbsp; 턴수: <span style="color:#10b981">&lt;40</span> · <span style="color:#f59e0b">40~50</span> · <span style="color:#ef4444">&gt;50</span>
      &nbsp;|&nbsp; 행 클릭 → 맵스코어 상세 펼침
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center;font-size:12px">
      <span style="color:var(--text-muted)">필터:</span>
      <select id="stg-diff-${gameId}" onchange="filterStages('${gameId}')" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text-secondary);font-size:12px">
        <option value="">전체 난이도</option>${diffFilterOpts}
      </select>
      <select id="stg-gold-${gameId}" onchange="filterStages('${gameId}')" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text-secondary);font-size:12px">
        <option value="">전체 골드</option>
        <option value="profit">수익 (+)</option>
        <option value="loss">손실 (-)</option>
      </select>
      <select id="stg-ms-${gameId}" onchange="filterStages('${gameId}')" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text-secondary);font-size:12px">
        <option value="">전체 맵스코어</option>
        <option value="low">&lt;650 (쉬움)</option>
        <option value="mid">650~800 (보통)</option>
        <option value="high">&gt;800 (어려움)</option>
      </select>
      <select id="stg-turns-${gameId}" onchange="filterStages('${gameId}')" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text-secondary);font-size:12px">
        <option value="">전체 턴수</option>
        <option value="low">&lt;40 (효율)</option>
        <option value="mid">40~50</option>
        <option value="high">&gt;50 (비효율)</option>
      </select>
      <select id="stg-bet-${gameId}" onchange="filterStages('${gameId}')" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text-secondary);font-size:12px">
        <option value="">전체 배수</option>
        <option value="1">x1</option>
        <option value="2">x2</option>
        <option value="4">x4</option>
      </select>
      <select id="stg-persona-${gameId}" onchange="filterStages('${gameId}')" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text-secondary);font-size:12px">
        <option value="">전체 모드</option>${personaFilterOpts}
      </select>
      <button onclick="resetStageFilters('${gameId}')" style="padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text-muted);font-size:11px;cursor:pointer">필터 초기화</button>
      <button onclick="resetStageSort('${gameId}')" style="padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text-muted);font-size:11px;cursor:pointer">정렬 원복 ↺</button>
    </div>
    <div class="tbl-wrap"><h4>스테이지별 상세 (${Object.keys(byStage).length}개)</h4>
      <table id="stg-table-${gameId}"><thead><tr>
        <th class="sortable" onclick="sortStageTable('${gameId}',0,'str')">스테이지</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',1,'num')">레벨</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',2,'num')">플레이</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',3,'num')">평균 시간</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',4,'num')">골드 손익</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',5,'num')">평균 턴수</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',6,'num')">맵 스코어</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',7,'str')">난이도</th>
        <th class="sortable" onclick="sortStageTable('${gameId}',8,'num')">배수</th>
      </tr></thead>
      <tbody>${rows}</tbody></table></div>
  `;
}

/* ══════════════════════════════════════════════
   카테고리: 보안 QA
   ══════════════════════════════════════════════ */
function renderCatSecurity(gameId, runs) {
  // ── 데이터 집계 ──
  const allChecks = [];
  let totalPass = 0, totalFail = 0, apiErrors = 0, apiTotal = 0;
  let critical = 0, warning = 0, info = 0;
  const clientChecks = { xss: [], storage: [], https: [], authority: [] };
  const serverChecks = { headers: [], infoLeak: [], idor: [], apiErr: [] };
  const balanceChecks = { pass: 0, fail: 0, items: [] };

  for (const r of runs) {
    const m = r.metrics || {};
    const sec = m.security;
    if (sec) {
      totalPass += sec.pass_count || 0;
      totalFail += sec.fail_count || 0;
      for (const c of (sec.checks || [])) {
        allChecks.push({ ...c, persona: r.persona, date: r.run_date });
        // 카테고리 분류
        const cat = (c.category || '').toLowerCase();
        if (cat.includes('balance') || (c.name && c.name.includes('입장료'))) {
          if (c.pass) balanceChecks.pass++; else { balanceChecks.fail++; balanceChecks.items.push(c); }
        }
      }
    }
    // web_security 결과 (security_scan에서)
    const ws = (m.security || {}).web_security || m.web_security || {};
    for (const wc of (ws.checks || [])) {
      const sev = wc.severity || 'pass';
      if (sev === 'critical') critical++;
      else if (sev === 'warning') warning++;
      else if (sev === 'info') info++;
      // 클라이언트/서버 분류
      const wCat = (wc.category || '').toLowerCase();
      if (wCat.includes('xss') || wCat.includes('싱크')) clientChecks.xss.push(wc);
      else if (wCat.includes('스토리지') || wCat.includes('storage')) clientChecks.storage.push(wc);
      else if (wCat.includes('https')) clientChecks.https.push(wc);
      else if (wCat.includes('권한') || wCat.includes('authority')) clientChecks.authority.push(wc);
      else if (wCat.includes('헤더') || wCat.includes('header')) serverChecks.headers.push(wc);
      else if (wCat.includes('정보') || wCat.includes('info') || wCat.includes('leakage')) serverChecks.infoLeak.push(wc);
      else if (wCat.includes('idor')) serverChecks.idor.push(wc);
      else if (wCat.includes('api') || wCat.includes('응답')) serverChecks.apiErr.push(wc);
    }
    // API 에러
    const apiS = m.api_summary || {};
    apiTotal += m.api_count || 0;
    apiErrors += apiS.error_count || 0;
    for (const [code, cnt] of Object.entries(apiS.by_status || {})) {
      if (+code >= 400) apiErrors += cnt;
    }
  }

  // 전체 등급 계산
  const totalAll = totalPass + totalFail + critical + warning + info;
  let gradeLabel, gradeColor;
  if (critical > 0) { gradeLabel = 'F'; gradeColor = '#ef4444'; }
  else if (totalFail > 10 || warning > 5) { gradeLabel = 'D'; gradeColor = '#ef4444'; }
  else if (totalFail > 3 || warning > 2) { gradeLabel = 'C'; gradeColor = '#f59e0b'; }
  else if (totalFail > 0 || warning > 0) { gradeLabel = 'B'; gradeColor = '#f59e0b'; }
  else { gradeLabel = 'A'; gradeColor = '#10b981'; }

  // ── 섹션 렌더 헬퍼 ──
  const renderCheckList = (checks, emptyMsg) => {
    if (!checks.length) return `<div style="color:var(--status-ok);font-size:12px;padding:4px 0">${emptyMsg}</div>`;
    return checks.map(c => {
      const sevColor = c.severity === 'critical' ? '#ef4444' : c.severity === 'warning' ? '#f59e0b' : '#3b82f6';
      const icon = c.pass ? '<span style="color:var(--status-ok)">✓</span>' : `<span style="color:${sevColor}">✗</span>`;
      const detail = c.detail || c.name || '';
      const evidence = (c.evidence || []).join(', ');
      return `<div style="font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)">${icon} ${detail}${evidence ? ` <span style="color:var(--text-muted);font-size:10px">${evidence}</span>` : ''}</div>`;
    }).join('');
  };

  return `
    <div style="display:flex;align-items:center;gap:16px;padding:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px">
      <div style="font-size:48px;font-weight:800;color:${gradeColor};min-width:60px;text-align:center">${gradeLabel}</div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:600;margin-bottom:6px">보안 종합 등급</div>
        <div style="display:flex;gap:16px;font-size:12px;flex-wrap:wrap">
          <span style="color:#ef4444">Critical ${critical}건</span>
          <span style="color:#f59e0b">Warning ${warning + totalFail}건</span>
          <span style="color:var(--status-ok)">Pass ${totalPass}건</span>
          <span style="color:var(--text-muted)">API 에러 ${apiErrors}건 / ${apiTotal.toLocaleString()}</span>
        </div>
      </div>
    </div>
    <div class="chart-grid">
      <div class="tbl-wrap">
        <h4>🖥 클라이언트 보안</h4>
        <div style="margin-bottom:12px">
          <div style="font-weight:600;font-size:12px;color:var(--text-muted);margin-bottom:2px">XSS 위험 요소</div>
          <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">innerHTML, eval, document.write 등 악성 스크립트 삽입 가능 패턴 검사</div>
          ${renderCheckList(clientChecks.xss, '위험 요소 없음')}
        </div>
        <div style="margin-bottom:12px">
          <div style="font-weight:600;font-size:12px;color:var(--text-muted);margin-bottom:2px">스토리지 민감정보</div>
          <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">localStorage/sessionStorage에 토큰, 비밀번호 등 민감 데이터 평문 저장 여부</div>
          ${renderCheckList(clientChecks.storage, '민감정보 없음')}
        </div>
        <div style="margin-bottom:12px">
          <div style="font-weight:600;font-size:12px;color:var(--text-muted);margin-bottom:2px">HTTPS 적용 상태</div>
          <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">모든 API 통신이 HTTPS로 암호화되어 있는지 확인 (HTTP 혼재 시 탈취 위험)</div>
          ${renderCheckList(clientChecks.https, 'HTTPS 정상')}
        </div>
        <div>
          <div style="font-weight:600;font-size:12px;color:var(--text-muted);margin-bottom:2px">클라이언트 권한 검증</div>
          <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">보상 금액, 난이도 등 서버가 결정해야 할 값을 클라이언트가 직접 전송하는지 감지</div>
          ${renderCheckList(clientChecks.authority, '권한 남용 미감지')}
        </div>
      </div>
      <div class="tbl-wrap">
        <h4>🌐 서버 보안</h4>
        <div style="margin-bottom:12px">
          <div style="font-weight:600;font-size:12px;color:var(--text-muted);margin-bottom:2px">보안 헤더 상태</div>
          <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">X-Frame-Options(클릭재킹), X-Content-Type-Options(MIME 스니핑), HSTS, CSP 필수 헤더 존재 확인</div>
          ${renderCheckList(serverChecks.headers, '필수 헤더 확인 불가 (응답 헤더 미수집)')}
        </div>
        <div style="margin-bottom:12px">
          <div style="font-weight:600;font-size:12px;color:var(--text-muted);margin-bottom:2px">서버 정보 노출</div>
          <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">Server, X-Powered-By 헤더에 서버 종류/버전이 노출되면 공격자가 취약점을 특정할 수 있음</div>
          ${renderCheckList(serverChecks.infoLeak, '정보 노출 없음')}
        </div>
        <div style="margin-bottom:12px">
          <div style="font-weight:600;font-size:12px;color:var(--text-muted);margin-bottom:2px">API 에러 빈도</div>
          <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">4xx/5xx 에러 비율이 높으면 비정상 요청 또는 서버 불안정 의심</div>
          ${apiErrors ? `<div style="font-size:12px;color:var(--status-err)">에러 ${apiErrors}건 / 총 ${apiTotal.toLocaleString()}건 (${(apiErrors/apiTotal*100).toFixed(1)}%)</div>` : '<div style="font-size:12px;color:var(--status-ok)">API 에러 없음</div>'}
        </div>
        <div>
          <div style="font-weight:600;font-size:12px;color:var(--text-muted);margin-bottom:2px">IDOR 패턴 감지</div>
          <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">URL/Body에 순차 정수 ID(user_id=1001)가 있으면 타인 데이터에 접근 가능한 취약점</div>
          ${renderCheckList(serverChecks.idor, 'IDOR 패턴 미감지')}
        </div>
      </div>
    </div>
    <div class="tbl-wrap">
      <h4>밸런스 검증 (입장료·보상)</h4>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <span class="badge ${balanceChecks.fail === 0 ? 'badge-ok' : 'badge-err'}">${balanceChecks.fail === 0 ? 'PASS' : 'FAIL'}</span>
        <span style="font-size:12px;color:var(--text-muted)">통과 ${balanceChecks.pass} / 실패 ${balanceChecks.fail}</span>
      </div>
      ${balanceChecks.items.length ? balanceChecks.items.map(c =>
        `<div style="font-size:12px;color:var(--status-err);padding:2px 0">✗ ${c.name || ''} — 예상: ${c.expected}, 실제: ${c.actual}</div>`
      ).join('') : '<div style="font-size:12px;color:var(--status-ok)">모든 검증 통과</div>'}
    </div>
    <div class="tbl-wrap">
      <h4>상세 증거 리스트</h4>
      ${allChecks.filter(c => !c.pass).length ? allChecks.filter(c => !c.pass).map(c =>
        `<div style="font-size:11px;padding:3px 0;border-bottom:1px solid var(--border);color:var(--text-secondary)">
          <span style="color:var(--status-err)">✗</span>
          <span style="color:var(--text-muted)">[${c.category || '?'}]</span>
          ${c.name || ''} ${c.detail ? '— ' + c.detail : ''}
          <span style="color:var(--text-muted);font-size:10px">(${c.date || ''} ${c.persona || ''})</span>
        </div>`
      ).join('') : '<div style="font-size:12px;color:var(--status-ok);padding:8px 0">실패 항목 없음</div>'}
    </div>
  `;
}

/* ══════════════════════════════════════════════
   카테고리: 로그 & API
   ══════════════════════════════════════════════ */
function renderCatLogApi(gameId, runs) {
  let totalApi = 0, totalConsole = 0;
  const byMethod = {};
  const topUrls = {};
  const byLevel = {};
  const allErrors = [];

  for (const r of runs) {
    const m = r.metrics || {};
    totalApi += m.api_count || 0;
    totalConsole += m.console_count || 0;

    const apiS = m.api_summary || {};
    for (const [method, cnt] of Object.entries(apiS.by_method || {})) {
      byMethod[method] = (byMethod[method] || 0) + cnt;
    }
    for (const [url, cnt] of Object.entries(apiS.top_urls || {})) {
      topUrls[url] = (topUrls[url] || 0) + cnt;
    }

    const conS = m.console_summary || {};
    for (const [lvl, cnt] of Object.entries(conS.by_level || {})) {
      byLevel[lvl] = (byLevel[lvl] || 0) + cnt;
    }
    for (const e of (conS.errors || [])) {
      allErrors.push({ ...e, run_date: r.run_date, persona: r.persona });
    }
  }

  const avgApi = runs.length ? Math.round(totalApi / runs.length) : 0;
  const avgConsole = runs.length ? Math.round(totalConsole / runs.length) : 0;
  const totalErrors = byLevel['error'] || 0;
  const totalWarns = byLevel['warn'] || 0;

  const methodRows = Object.entries(byMethod).sort(([,a],[,b]) => b - a)
    .map(([m, c]) => `<tr><td>${m}</td><td>${c.toLocaleString()}</td><td>${totalApi ? (c / totalApi * 100).toFixed(1) : 0}%</td></tr>`).join('');

  const urlRows = Object.entries(topUrls).sort(([,a],[,b]) => b - a).slice(0, 10)
    .map(([url, c]) => {
      const short = url.length > 60 ? url.slice(0, 57) + '...' : url;
      return `<tr><td style="font-size:11px;word-break:break-all">${short}</td><td>${c.toLocaleString()}</td></tr>`;
    }).join('');

  const levelColors = { log: 'var(--text-muted)', warn: 'var(--status-warn)', error: 'var(--status-err)', info: '#3b82f6', debug: '#8b5cf6' };
  const levelRows = Object.entries(byLevel).sort(([,a],[,b]) => b - a)
    .map(([lvl, c]) => `<tr><td style="color:${levelColors[lvl] || 'var(--text-secondary)'}">${lvl}</td><td>${c.toLocaleString()}</td><td>${totalConsole ? (c / totalConsole * 100).toFixed(1) : 0}%</td></tr>`).join('');

  const apiNote = totalApi === 0 ? `<div style="font-size:11px;color:var(--text-muted);padding:6px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;margin-bottom:12px">ℹ️ API 호출 0건 — 이 게임은 자체 API 서버 대신 Facebook Instant Games 프레임워크를 통해 통신하므로 별도 API 로그가 수집되지 않습니다.</div>` : '';

  // 에러 요약 배너 (error가 있을 때만)
  const errorBanner = totalErrors > 0 ? (() => {
    const errOnly = allErrors.filter(e => e.level === 'error');
    // 메시지가 저장 안 된 경우 by_level 카운트만으로 표시
    const uniqueMsgs = errOnly.length ? [...new Set(errOnly.map(e => (e.message || '').slice(0, 100)))]
      : [`(에러 상세 미수집 — 다음 프리플레이부터 자동 수집됩니다)`];
    const rows = uniqueMsgs.map(msg =>
      `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px">
        <span style="color:var(--status-err);font-weight:700">ERROR</span>
        <span style="flex:1">${msg}</span>
        <span style="color:var(--text-muted);font-size:11px">${errOnly.filter(e => e.message?.startsWith(msg.slice(0,80))).map(e => e.persona).filter((v,i,a) => a.indexOf(v)===i).join(', ')}</span>
      </div>`
    ).join('');
    return `<div style="background:#7f1d1d22;border:1px solid #ef4444;border-radius:8px;padding:10px 14px;margin-bottom:12px">
      <div style="font-weight:700;color:var(--status-err);margin-bottom:4px">Error ${totalErrors}건 감지</div>
      ${rows}
    </div>`;
  })() : '';

  return `
    ${apiNote}
    ${errorBanner}
    <div class="metric-row">
      <div class="metric-box"><div class="label">총 API 호출</div><div class="value">${totalApi.toLocaleString()}</div><div class="sub">런당 평균 ${avgApi}</div></div>
      <div class="metric-box"><div class="label">총 콘솔 로그</div><div class="value">${totalConsole.toLocaleString()}</div><div class="sub">런당 평균 ${avgConsole}</div></div>
      <div class="metric-box"><div class="label">Error</div><div class="value" style="color:${totalErrors > 0 ? 'var(--status-err)' : 'var(--status-ok)'}">${totalErrors}</div></div>
      <div class="metric-box"><div class="label">Warn</div><div class="value" style="color:${totalWarns > 0 ? 'var(--status-warn)' : 'var(--status-ok)'}">${totalWarns}</div></div>
      <div class="metric-box"><div class="label">총 런</div><div class="value">${runs.length}</div></div>
    </div>
    <div class="chart-grid">
      <div class="tbl-wrap"><h4>API 메서드별</h4>
        <table><thead><tr><th>메서드</th><th>건수</th><th>비율</th></tr></thead>
        <tbody>${methodRows || '<tr><td colspan="3" style="color:var(--text-muted)">데이터 없음</td></tr>'}</tbody></table></div>
      <div class="tbl-wrap"><h4>콘솔 레벨별</h4>
        <table><thead><tr><th>레벨</th><th>건수</th><th>비율</th></tr></thead>
        <tbody>${levelRows || '<tr><td colspan="3" style="color:var(--text-muted)">데이터 없음</td></tr>'}</tbody></table></div>
    </div>
    <div class="tbl-wrap"><h4>상위 API URL (Top 10)</h4>
      <table><thead><tr><th>URL</th><th>건수</th></tr></thead>
      <tbody>${urlRows || '<tr><td colspan="2" style="color:var(--text-muted)">데이터 없음</td></tr>'}</tbody></table></div>
    ${renderConsoleErrors(allErrors)}
  `;
}

function renderConsoleErrors(allErrors) {
  if (!allErrors.length) return '';

  // 반복 에러 패턴 집계 (메시지 앞 80자 기준 그룹핑)
  const patternMap = {};
  for (const e of allErrors) {
    const key = (e.message || '').slice(0, 80);
    if (!patternMap[key]) patternMap[key] = { level: e.level, message: e.message, count: 0, runs: new Set() };
    patternMap[key].count++;
    patternMap[key].runs.add(e.run_date + '_' + e.persona);
  }
  const topPatterns = Object.values(patternMap).sort((a, b) => b.count - a.count).slice(0, 10);

  const patternRows = topPatterns.map(p => {
    const lvlColor = p.level === 'error' ? 'var(--status-err)' : 'var(--status-warn)';
    const short = p.message.length > 100 ? p.message.slice(0, 97) + '...' : p.message;
    return `<tr>
      <td style="color:${lvlColor};font-weight:600;width:50px">${p.level}</td>
      <td style="font-size:11px;word-break:break-all" title="${p.message.replace(/"/g, '&quot;')}">${short}</td>
      <td style="text-align:center">${p.count}</td>
      <td style="text-align:center;color:var(--text-muted)">${p.runs.size}</td>
    </tr>`;
  }).join('');

  // 최근 에러 목록 (최신순 20건)
  const recent = [...allErrors].sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || '')).slice(0, 20);
  const recentRows = recent.map(e => {
    const lvlColor = e.level === 'error' ? 'var(--status-err)' : 'var(--status-warn)';
    const short = (e.message || '').length > 120 ? e.message.slice(0, 117) + '...' : (e.message || '');
    const ts = e.timestamp ? e.timestamp.split('T')[1]?.slice(0, 8) || '' : '';
    return `<tr>
      <td style="color:${lvlColor};font-weight:600;width:50px">${e.level}</td>
      <td style="font-size:11px;word-break:break-all" title="${(e.message || '').replace(/"/g, '&quot;')}">${short}</td>
      <td style="white-space:nowrap;color:var(--text-muted);font-size:11px">${e.persona || ''}</td>
      <td style="white-space:nowrap;color:var(--text-muted);font-size:11px">${ts}</td>
    </tr>`;
  }).join('');

  const errCount = allErrors.filter(e => e.level === 'error').length;
  const warnCount = allErrors.filter(e => e.level === 'warn').length;

  return `
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <h4 style="margin:0">콘솔 에러/경고 로그</h4>
        <span class="badge ${errCount > 0 ? 'badge-err' : 'badge-ok'}" style="font-size:11px">Error ${errCount}</span>
        <span class="badge" style="font-size:11px;background:var(--status-warn);color:#000">Warn ${warnCount}</span>
      </div>
      <div class="chart-grid">
        <div class="tbl-wrap"><h4>반복 에러 패턴 (Top 10)</h4>
          <table><thead><tr><th>레벨</th><th>메시지</th><th>횟수</th><th>런 수</th></tr></thead>
          <tbody>${patternRows}</tbody></table></div>
        <div class="tbl-wrap"><h4>최근 에러/경고 (최신 20건)</h4>
          <table><thead><tr><th>레벨</th><th>메시지</th><th>페르소나</th><th>시간</th></tr></thead>
          <tbody>${recentRows}</tbody></table></div>
      </div>
    </div>`;
}

/* ══════════════════════════════════════════════
   카테고리: 성능 (대폭 강화)
   ══════════════════════════════════════════════ */
function renderCatPerf(gameId, runs) {
  const perfs = runs.map(r => (r.metrics || {}).perf).filter(Boolean);
  if (!perfs.length) return '<div style="color:var(--text-muted);padding:20px">성능 데이터 없음</div>';

  // PBM 판별 용어: "레벨" 대신 "판" 사용
  const isPBM = gameId === 'PBM';
  const unitName = isPBM ? '판' : '레벨';
  const unitPerName = isPBM ? '판당' : '레벨당';
  const startTag = 'level_start';
  const endTag = 'level_end';

  // snapshots 수집
  const allSnaps = [];
  for (const p of perfs) {
    for (const s of (p.snapshots || [])) {
      if (s.cdp) allSnaps.push({
        level: s.level, tag: s.tag,
        heap: s.cdp.js_heap_used || 0,
        heapTotal: s.cdp.js_heap_total || 0,
        dom: s.cdp.dom_nodes || 0,
        listeners: s.cdp.js_event_listeners || 0,
        taskDuration: s.cdp.task_duration || 0,
        timestamp: s.timestamp || 0,
      });
    }
  }
  if (!allSnaps.length) return '<div style="color:var(--text-muted);padding:20px">스냅샷 데이터 없음</div>';

  const fmtMB = (v) => (v / 1048576).toFixed(1);

  // start/end 분리 (PBM: freeplay_start/end, 기타: level_start/end)
  const starts = allSnaps.filter(s => s.tag === startTag).sort((a,b) => a.level - b.level);
  const ends = allSnaps.filter(s => s.tag === endTag).sort((a,b) => a.level - b.level);

  // 메트릭 카드 1행: 시작/종료/총증가
  const firstStart = starts.length ? starts[0] : null;
  const lastEnd = ends.length ? ends[ends.length - 1] : null;
  const startMB = firstStart ? fmtMB(firstStart.heap) : '-';
  const endMB = lastEnd ? fmtMB(lastEnd.heap) : '-';
  const totalGrowth = (firstStart && lastEnd) ? (lastEnd.heap - firstStart.heap) : 0;
  const totalGrowthMB = fmtMB(Math.abs(totalGrowth));
  const growthSign = totalGrowth >= 0 ? '+' : '-';
  const growthColor = totalGrowth > 0 ? 'var(--status-err)' : 'var(--status-ok)';

  // 메트릭 카드 2행: 단위당 평균 증가, 피크 메모리, CPU 부하
  const levelDeltas = [];
  const levelSet = new Set(starts.map(s => s.level));
  for (const lvl of levelSet) {
    const ls = starts.find(s => s.level === lvl);
    const le = ends.find(s => s.level === lvl);
    if (ls && le) levelDeltas.push({ level: lvl, delta: le.heap - ls.heap, endHeap: le.heap });
  }
  const avgDeltaMB = levelDeltas.length ? fmtMB(levelDeltas.reduce((a,d) => a + d.delta, 0) / levelDeltas.length) : '-';
  const peakHeap = allSnaps.reduce((mx, s) => Math.max(mx, s.heap), 0);
  const peakMB = fmtMB(peakHeap);
  const avgTaskDur = allSnaps.length ? (allSnaps.reduce((a,s) => a + s.taskDuration, 0) / allSnaps.length).toFixed(3) : '-';

  // 누수 진단: 전반부 vs 후반부
  const halfIdx = Math.floor(ends.length / 2);
  const firstHalf = ends.slice(0, halfIdx);
  const secondHalf = ends.slice(halfIdx);
  const firstHalfAvg = firstHalf.length ? firstHalf.reduce((a,s) => a + s.heap, 0) / firstHalf.length : 0;
  const secondHalfAvg = secondHalf.length ? secondHalf.reduce((a,s) => a + s.heap, 0) / secondHalf.length : 0;
  const leakPct = firstHalfAvg > 0 ? ((secondHalfAvg - firstHalfAvg) / firstHalfAvg * 100).toFixed(1) : '0';
  const leakColor = +leakPct >= 20 ? 'var(--status-err)' : +leakPct >= 10 ? 'var(--status-warn)' : 'var(--status-ok)';
  const leakBarWidth = Math.min(100, Math.max(5, Math.abs(+leakPct)));

  // 메모리 급증 Top 3
  const top3 = [...levelDeltas].sort((a,b) => b.delta - a.delta).slice(0, 3);
  const top3Rows = top3.map(d =>
    `<tr><td>${isPBM ? '#' + d.level : 'Lv' + d.level}</td><td style="color:var(--status-err)">+${fmtMB(d.delta)} MB</td><td>${fmtMB(d.endHeap)} MB</td></tr>`
  ).join('');

  // DOM / 리스너
  const firstDom = firstStart ? firstStart.dom : 0;
  const lastDom = lastEnd ? lastEnd.dom : 0;
  const avgListeners = allSnaps.length ? Math.round(allSnaps.reduce((a,s) => a + s.listeners, 0) / allSnaps.length) : 0;

  return `
    <div class="metric-row">
      <div class="metric-box"><div class="label">시작 메모리</div><div class="value">${startMB} MB</div><div class="sub">첫 ${unitName} 시작 시 JS Heap</div></div>
      <div class="metric-box"><div class="label">종료 메모리</div><div class="value">${endMB} MB</div><div class="sub">마지막 ${unitName} 종료 시 JS Heap</div></div>
      <div class="metric-box"><div class="label">총 증가량</div><div class="value" style="color:${growthColor}">${growthSign}${totalGrowthMB} MB</div></div>
    </div>
    <div class="metric-row">
      <div class="metric-box"><div class="label">${unitPerName} 평균 증가</div><div class="value">${avgDeltaMB} MB</div></div>
      <div class="metric-box"><div class="label">피크 메모리</div><div class="value">${peakMB} MB</div></div>
      <div class="metric-box"><div class="label">CPU 부하 (task_duration)</div><div class="value">${avgTaskDur}초</div><div class="sub">스냅샷 평균</div></div>
    </div>
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px">
      <h4 style="font-size:14px;color:var(--text-secondary);margin-bottom:12px">누수 진단</h4>
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:8px">
        <div style="font-size:12px;color:var(--text-muted)">전반부 평균: <b style="color:var(--text-primary)">${fmtMB(firstHalfAvg)} MB</b></div>
        <div style="font-size:16px;color:var(--text-muted)">→</div>
        <div style="font-size:12px;color:var(--text-muted)">후반부 평균: <b style="color:var(--text-primary)">${fmtMB(secondHalfAvg)} MB</b></div>
        <div style="font-size:14px;font-weight:700;color:${leakColor}">${leakPct}%</div>
      </div>
      <div class="leak-gauge">
        <div class="leak-gauge-fill" style="width:${leakBarWidth}%;background:${leakColor}">${leakPct}%</div>

function renderPerfCharts(gameId, runs) {
  const perfs = runs.map(r => (r.metrics || {}).perf).filter(Boolean);
  const allSnaps = [];
  for (const p of perfs) {
    for (const s of (p.snapshots || [])) {
      if (s.cdp) allSnaps.push({
        level: s.level, tag: s.tag,
        heap: s.cdp.js_heap_used || 0,
        dom: s.cdp.dom_nodes || 0,
        listeners: s.cdp.js_event_listeners || 0,
        taskDuration: s.cdp.task_duration || 0,
        timestamp: s.timestamp || 0,
      });
    }
  }
  if (!allSnaps.length) return;

  // PBM: "판" 단위 라벨
  const isPBM = gameId === 'PBM';
  const startTag = 'level_start';
  const endTag = 'level_end';
  const lblFn = isPBM ? (l => `#${l}`) : (l => `Lv${l}`);

  const starts = allSnaps.filter(s => s.tag === startTag).sort((a,b) => a.level - b.level);
  const ends = allSnaps.filter(s => s.tag === endTag).sort((a,b) => a.level - b.level);
  const levels = [...new Set(allSnaps.map(s => s.level))].sort((a,b) => a - b);

  const fmtMB = (v) => +(v / 1048576).toFixed(1);

  // 1) 메모리 (이중축: 시작/종료 힙 + 단위당 증감)
  const memStartData = levels.map(l => { const s = starts.find(x => x.level === l); return s ? fmtMB(s.heap) : null; });
  const memEndData = levels.map(l => { const s = ends.find(x => x.level === l); return s ? fmtMB(s.heap) : null; });
  const memDeltaData = levels.map(l => {
    const ls = starts.find(x => x.level === l);
    const le = ends.find(x => x.level === l);
    return (ls && le) ? fmtMB(le.heap - ls.heap) : null;
  });

  const memKey = `perf-mem-${gameId}`;
  if (_charts[memKey]) _charts[memKey].destroy();
  const memCanvas = document.getElementById(`chart-perf-mem-${gameId}`);
  if (memCanvas) {
    _charts[memKey] = new Chart(memCanvas, {
      type: 'line',
      data: {
        labels: levels.map(lblFn),
        datasets: [
          { label: '시작 Heap (MB)', data: memStartData, borderColor: '#3b82f6', backgroundColor: '#3b82f622', tension: 0.3, fill: false, yAxisID: 'y' },
          { label: '종료 Heap (MB)', data: memEndData, borderColor: '#ef4444', backgroundColor: '#ef444422', tension: 0.3, fill: false, yAxisID: 'y' },
          { label: '증감 (MB)', data: memDeltaData, borderColor: '#f59e0b', backgroundColor: '#f59e0b55', type: 'bar', borderRadius: 3, yAxisID: 'y1' },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          y: { position: 'left', title: { display: true, text: 'Heap (MB)' } },
          y1: { position: 'right', title: { display: true, text: '증감 (MB)' }, grid: { drawOnChartArea: false } },
        },
        plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } },
      },
    });
  }

  // 2) DOM 수 변화 (시작/종료)
  const domStartData = levels.map(l => { const s = starts.find(x => x.level === l); return s ? s.dom : null; });
  const domEndData = levels.map(l => { const s = ends.find(x => x.level === l); return s ? s.dom : null; });

  const domKey = `perf-dom-${gameId}`;
  if (_charts[domKey]) _charts[domKey].destroy();
  const domCanvas = document.getElementById(`chart-perf-dom-${gameId}`);
  if (domCanvas) {
    _charts[domKey] = new Chart(domCanvas, {
      type: 'line',
      data: {
        labels: levels.map(lblFn),
        datasets: [
          { label: '시작 DOM', data: domStartData, borderColor: '#10b981', tension: 0.3, fill: false },
          { label: '종료 DOM', data: domEndData, borderColor: '#f59e0b', tension: 0.3, fill: false },
        ],
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } } },
    });
  }

  // 3) CPU 부하 (task_duration)
  const cpuStartData = levels.map(l => { const s = starts.find(x => x.level === l); return s ? +s.taskDuration.toFixed(3) : null; });
  const cpuEndData = levels.map(l => { const s = ends.find(x => x.level === l); return s ? +s.taskDuration.toFixed(3) : null; });

  const cpuKey = `perf-cpu-${gameId}`;
  if (_charts[cpuKey]) _charts[cpuKey].destroy();
  const cpuCanvas = document.getElementById(`chart-perf-cpu-${gameId}`);
  if (cpuCanvas) {
    _charts[cpuKey] = new Chart(cpuCanvas, {
      type: 'bar',
      data: {
        labels: levels.map(lblFn),
        datasets: [
          { label: '시작 시 task_duration', data: cpuStartData, backgroundColor: '#3b82f699', borderColor: '#3b82f6', borderWidth: 1, borderRadius: 3 },
          { label: '종료 시 task_duration', data: cpuEndData, backgroundColor: '#ef444499', borderColor: '#ef4444', borderWidth: 1, borderRadius: 3 },
        ],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { y: { title: { display: true, text: '초' } } },
        plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } },
      },
    });
  }

  // 4) 경과시간별 메모리 변화 (x축: 분) — 런 간 갭 제거
  const timeSnaps = allSnaps.filter(s => s.timestamp).sort((a,b) => a.timestamp - b.timestamp);

  if (timeSnaps.length) {
    // 연속 경과시간: 런 간 10분 이상 갭은 제거하여 실제 플레이 시간만 표시
    const GAP_THRESHOLD = 600; // 10분 (초)
    const elapsedMins = [0];
    for (let i = 1; i < timeSnaps.length; i++) {
      const delta = timeSnaps[i].timestamp - timeSnaps[i - 1].timestamp;
      const inc = delta > GAP_THRESHOLD ? 0 : delta / 60;
      elapsedMins.push(+(elapsedMins[i - 1] + inc).toFixed(1));
    }
    const timeMemLabels = elapsedMins.map(v => v.toFixed(1));
    const timeMemData = timeSnaps.map(s => fmtMB(s.heap));

    const tmKey = `perf-timemem-${gameId}`;
    if (_charts[tmKey]) _charts[tmKey].destroy();
    const tmCanvas = document.getElementById(`chart-perf-timemem-${gameId}`);
    if (tmCanvas) {
      _charts[tmKey] = new Chart(tmCanvas, {
        type: 'line',
        data: { labels: timeMemLabels, datasets: [{ label: 'Heap (MB)', data: timeMemData, borderColor: '#8b5cf6', tension: 0.3, fill: true, backgroundColor: '#8b5cf622' }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { x: { title: { display: true, text: '경과 (분)' }, ticks: { maxTicksLimit: 15 } } },
          plugins: { legend: { display: false } },
        },
      });
    }

    const timeCpuData = timeSnaps.map(s => +s.taskDuration.toFixed(3));
    const tcKey = `perf-timecpu-${gameId}`;
    if (_charts[tcKey]) _charts[tcKey].destroy();
    const tcCanvas = document.getElementById(`chart-perf-timecpu-${gameId}`);
    if (tcCanvas) {
      _charts[tcKey] = new Chart(tcCanvas, {
        type: 'line',
        data: { labels: timeMemLabels, datasets: [{ label: 'task_duration (초)', data: timeCpuData, borderColor: '#ec4899', tension: 0.3, fill: true, backgroundColor: '#ec489922' }] },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: { x: { title: { display: true, text: '경과 (분)' }, ticks: { maxTicksLimit: 15 } } },
          plugins: { legend: { display: false } },
        },
      });
    }
  }
}

/* ── 스테이지 정렬 ── */

const _stgSortState = {};

function sortStageTable(gameId, colIdx, type) {
  const table = document.getElementById(`stg-table-${gameId}`);
  if (!table) return;
  const tbody = table.querySelector('tbody');
  // 데이터 행만 (상세행 제외)
  const dataRows = [...tbody.querySelectorAll('tr')].filter(r => !r.id || !r.id.startsWith('ms_'));
  const detailRows = [...tbody.querySelectorAll('tr')].filter(r => r.id && r.id.startsWith('ms_'));
  const key = `${gameId}-${colIdx}`;
  const asc = _stgSortState[key] = !_stgSortState[key];

  dataRows.sort((a, b) => {
    const aText = a.querySelectorAll('td')[colIdx]?.textContent.trim() || '';
    const bText = b.querySelectorAll('td')[colIdx]?.textContent.trim() || '';
    if (type === 'num') {
      const aNum = parseFloat(aText.replace(/[^0-9.\-]/g, '')) || 0;
      const bNum = parseFloat(bText.replace(/[^0-9.\-]/g, '')) || 0;
      return asc ? aNum - bNum : bNum - aNum;
    }
    return asc ? aText.localeCompare(bText) : bText.localeCompare(aText);
  });
  // 데이터행 + 상세행 쌍으로 재배치
  dataRows.forEach(r => {
    tbody.appendChild(r);
    const st = r.querySelectorAll('td')[0]?.textContent.trim();
    const detail = detailRows.find(d => d.id === `ms_${gameId}_${st}`);
    if (detail) tbody.appendChild(detail);
  });

  // 헤더 표시 업데이트
  table.querySelectorAll('th.sortable').forEach((th, i) => {
    th.textContent = th.textContent.replace(/ [▲▼]/g, '');
    if (i === colIdx) th.textContent += asc ? ' ▲' : ' ▼';
  });
}

function resetStageSort(gameId) {
  const table = document.getElementById(`stg-table-${gameId}`);
  if (!table) return;
  const tbody = table.querySelector('tbody');
  // data-row가 없으면 원본 순서 기준 = 레벨 번호 오름차순
  const rows = [...tbody.querySelectorAll('tr')].filter(r => !r.id || !r.id.startsWith('ms_'));
  const detailRows = [...tbody.querySelectorAll('tr')].filter(r => r.id && r.id.startsWith('ms_'));
  rows.sort((a, b) => {
    const aLv = parseInt(a.querySelectorAll('td')[1]?.textContent.replace(/[^0-9]/g, '')) || 0;
    const bLv = parseInt(b.querySelectorAll('td')[1]?.textContent.replace(/[^0-9]/g, '')) || 0;
    return aLv - bLv;
  });
  // 각 행 뒤에 상세행 배치
  rows.forEach(r => {
    tbody.appendChild(r);
    const cells = r.querySelectorAll('td');
    const st = cells[0]?.textContent.trim();
    const detail = detailRows.find(d => d.id === `ms_${gameId}_${st}`);
    if (detail) tbody.appendChild(detail);
  });
  // 헤더 화살표 제거
  table.querySelectorAll('th.sortable').forEach(th => {
    th.textContent = th.textContent.replace(/ [▲▼]/g, '');
  });
  // 정렬 상태 초기화
  Object.keys(_stgSortState).forEach(k => { if (k.startsWith(gameId)) delete _stgSortState[k]; });
}

/* ── 스테이지 필터 ── */

function filterStages(gameId) {
  const diffVal = document.getElementById(`stg-diff-${gameId}`)?.value || '';
  const goldVal = document.getElementById(`stg-gold-${gameId}`)?.value || '';
  const msVal = document.getElementById(`stg-ms-${gameId}`)?.value || '';
  const turnsVal = document.getElementById(`stg-turns-${gameId}`)?.value || '';
  const table = document.getElementById(`stg-table-${gameId}`);
  if (!table) return;

  const rows = table.querySelectorAll('tbody tr');
  rows.forEach(row => {
    const cells = row.querySelectorAll('td');
    if (cells.length < 8) return;
    const turns = parseFloat(cells[4].textContent) || 0;
    const ms = parseInt(cells[5].textContent) || 0;
    const gold = parseInt(cells[6].textContent.replace(/,/g, '')) || 0;
    const diffText = cells[7].textContent.trim();

    let show = true;
    // 난이도 필터
    if (diffVal && DIFF_TIERS[diffVal] !== diffText) show = false;
    // 골드 필터
    if (goldVal === 'profit' && gold < 0) show = false;
    if (goldVal === 'loss' && gold >= 0) show = false;
    // 맵스코어 필터
    if (msVal === 'low' && ms >= 650) show = false;
    if (msVal === 'mid' && (ms < 650 || ms > 800)) show = false;
    if (msVal === 'high' && ms <= 800) show = false;
    // 턴수 필터
    if (turnsVal === 'low' && turns >= 40) show = false;
    if (turnsVal === 'mid' && (turns < 40 || turns > 50)) show = false;
    if (turnsVal === 'high' && turns <= 50) show = false;
    // 배수 필터
    const betVal = document.getElementById(`stg-bet-${gameId}`)?.value || '';
    if (betVal) {
      const betText = cells[8]?.textContent || '';
      if (!betText.includes(`x${betVal}`)) show = false;
    }
    // 모드(페르소나) 필터
    const personaVal = document.getElementById(`stg-persona-${gameId}`)?.value || '';
    if (personaVal) {
      const rowPersonas = row.getAttribute('data-personas') || '';
      if (!rowPersonas.split(',').includes(personaVal)) show = false;
    }

    row.style.display = show ? '' : 'none';
  });
}

function resetStageFilters(gameId) {
  ['diff', 'gold', 'ms', 'turns', 'bet', 'persona'].forEach(f => {
    const el = document.getElementById(`stg-${f}-${gameId}`);
    if (el) el.value = '';
  });
  filterStages(gameId);
}

function renderRunManager(runs) {

  const rmPersonas = [...new Set(runs.map(r => r.persona).filter(Boolean))].sort((a, b) =>
    (PERSONA_ORDER.indexOf(a)===-1?99:PERSONA_ORDER.indexOf(a)) - (PERSONA_ORDER.indexOf(b)===-1?99:PERSONA_ORDER.indexOf(b))
  );

          <option value="">전체</option>${gameOpts}
        </select>

        <select id="rm-persona" onchange="filterRunManager()" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);color:var(--text-secondary);font-size:12px">
          <option value="">전체</option>${personaOpts}
        </select>
        <span style="color:var(--text-muted)">기간:</span>

        <span>~</span>
        <input type="date" id="rm-to" value="${maxDate}" onchange="filterRunManager()">
        <button class="rm-btn" onclick="filterRunManager()">조회</button>

      </div>
      <div id="rm-list"></div>
      <div class="rm-actions">
        <button class="rm-btn rm-btn-danger" onclick="deleteSelectedRuns()">선택 삭제</button>
        <span id="rm-status" style="font-size:11px;color:var(--text-muted)"></span>

function filterRunManager() {
  const from = document.getElementById('rm-from')?.value || '';
  const to = document.getElementById('rm-to')?.value || '';
  const gameFilter = document.getElementById('rm-game')?.value || '';
  const personaFilter = document.getElementById('rm-persona')?.value || '';
  const listEl = document.getElementById('rm-list');
  if (!listEl) return;

  const filtered = _allRuns.filter(r => {
    if (from && r.run_date < from) return false;
    if (to && r.run_date > to) return false;
    if (gameFilter && r.game_id !== gameFilter) return false;
    if (personaFilter && r.persona !== personaFilter) return false;
    return true;
  }).sort((a, b) => {
    if (a.game_id !== b.game_id) return a.game_id.localeCompare(b.game_id);
    if (a.run_date !== b.run_date) return b.run_date.localeCompare(a.run_date);
    return (PERSONA_ORDER.indexOf(a.persona)===-1?99:PERSONA_ORDER.indexOf(a.persona)) - (PERSONA_ORDER.indexOf(b.persona)===-1?99:PERSONA_ORDER.indexOf(b.persona));
  });

  if (!filtered.length) {
    listEl.innerHTML = '<div style="color:var(--text-muted);padding:8px;font-size:12px">해당 조건에 데이터 없음</div>';
    return;
  }

  listEl.innerHTML = filtered.map(r => {
    const m = r.metrics || {};
    const pColor = PERSONA_COLORS[r.persona] || '#999';
    const pName = PERSONA_KO[r.persona] || r.persona;
    const goldPnl = m.gold_pnl != null ? m.gold_pnl.toLocaleString() : '-';
    const goldColor = (m.gold_pnl || 0) >= 0 ? 'var(--status-ok)' : 'var(--status-err)';
    return `<div class="rm-row" data-run-id="${r.id}">
      <input type="checkbox" class="rm-check" value="${r.id}">
      <span style="font-weight:600;min-width:36px;color:var(--text-muted)">${r.game_id}</span>
      <span style="min-width:80px">${r.run_date}</span>
      <span style="color:${pColor};font-weight:600;min-width:40px">${pName}</span>
      <span style="min-width:50px">${r.levels_played}판</span>
      <span style="color:${goldColor};min-width:70px">골드 ${goldPnl}</span>
      <span style="color:var(--text-muted);min-width:50px">${r.total_time_sec ? Math.round(r.total_time_sec) + '초' : '-'}</span>
      <span style="color:var(--text-muted);font-size:10px">${r.id.slice(0, 8)}</span>
    </div>`;

async function renderDbUsage() {
  const section = document.getElementById('db-usage-section');
  if (!section) return;
  try {
    const usage = await fetchDbUsage();
    if (!usage.length) { section.innerHTML = ''; return; }
    const totalBytes = usage.reduce((a, t) => a + (Number(t.size_bytes) || 0), 0);
    const totalRows = usage.reduce((a, t) => a + (Number(t.row_count) || 0), 0);
    const limitBytes = 500 * 1024 * 1024; // 500MB Free Tier
    const pct = Math.min(100, (totalBytes / limitBytes * 100)).toFixed(1);
    const barColor = pct >= 80 ? 'var(--status-err)' : pct >= 50 ? 'var(--status-warn)' : 'var(--status-ok)';
    const warnBadge = pct >= 80 ? ' <span class="badge badge-err">경고: 80% 초과</span>' : '';
    updateSidebarDbMini(parseFloat(pct), barColor);

    const tableRows = usage.map(t => {
      const sizeMB = (Number(t.size_bytes) / 1024 / 1024).toFixed(2);
      return `<tr>
        <td>${t.table_name}</td>
        <td style="text-align:right">${Number(t.row_count).toLocaleString()}</td>
        <td style="text-align:right">${sizeMB} MB</td>
      </tr>`;
    }).join('');

    section.innerHTML = `
      <div class="db-usage-bar">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span style="font-weight:700;font-size:14px">DB 용량</span>
          <span style="font-size:12px;color:var(--text-muted)">${(totalBytes / 1024 / 1024).toFixed(1)} MB / 500 MB (${pct}%)${warnBadge}</span>
        </div>
        <div class="db-usage-track">
          <div class="db-usage-fill" style="width:${pct}%;background:${barColor}"></div>
        </div>
        <table style="margin-top:10px">
          <thead><tr><th>테이블</th><th style="text-align:right">행 수</th><th style="text-align:right">용량</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    `;
  } catch (e) {
    console.warn('DB 용량 조회 실패:', e.message);
    section.innerHTML = '';
  }
}

/* ── Realtime 구독 ── */

let _realtimeChannel = null;
let _rtRetryCount = 0;
const RT_MAX_RETRIES = 5;

function updateRealtimeIndicator(connected) {
  const dot = document.getElementById('rt-dot');
  const label = document.getElementById('rt-label');
  if (!dot || !label) return;
  if (connected) {
    dot.classList.add('connected');
    label.textContent = '실시간';
  } else {
    dot.classList.remove('connected');
    label.textContent = '오프라인';
  }
}

function subscribeRealtime() {
  if (_realtimeChannel) {
    sb.removeChannel(_realtimeChannel);
  }
  _realtimeChannel = sb.channel('dashboard-live')
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'freeplay_runs' },
      async (payload) => {
        await refreshOverviewFromViews();
        showToast(`새 런 도착: ${payload.new.game_id} / ${payload.new.persona}`);
        if (_currentGameId === payload.new.game_id) {
          await refreshCurrentGameDetail();
        }
      }
    )
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'health_checks' },
      async () => {
        try {
          const checks = await fetchHealthChecks();
          renderHealthCheck(checks);
        } catch (e) { console.warn('health_checks 갱신 실패:', e.message); }
      }
    )
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'nru_runs' },
      async (payload) => {
        try {
          _nruRuns = await fetchNruRuns();
          renderNruSummary(_nruRuns);
          const status = payload.new.ready ? 'PASS' : 'FAIL';
          showToast(`NRU 결과 도착: ${status} (Lv${payload.new.levels_cleared})`);
        } catch (e) { console.warn('nru_runs 갱신 실패:', e.message); }
      }
    )
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'cron_history' },
      async () => {
        try {
          const cron = await fetchCronHistory();
          renderCronHistory(cron);
        } catch (e) { console.warn('cron_history 갱신 실패:', e.message); }
      }
    )
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        updateRealtimeIndicator(true);
        _rtRetryCount = 0;
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        updateRealtimeIndicator(false);
        if (_rtRetryCount < RT_MAX_RETRIES) {
          _rtRetryCount++;
          const delay = Math.min(3000 * Math.pow(2, _rtRetryCount - 1), 30000);
          console.warn(`Realtime 재연결 시도 ${_rtRetryCount}/${RT_MAX_RETRIES} (${delay}ms 후)`);
          setTimeout(() => subscribeRealtime(), delay);
        } else {
          showToast('실시간 연결 실패. 수동 새로고침을 사용해주세요.', 5000);
        }
      } else if (status === 'CLOSED') {
        updateRealtimeIndicator(false);
      }
    });
}

async function init() {
  const loadingEl = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const overviewEl = document.getElementById('overview-panel');

  applyTheme(getTheme());
  document.documentElement.style.setProperty('--fs-scale', FS_STEPS[fsIdx]);
  restoreSidebar();

  try {
    loadingEl.style.display = 'flex';
    errorEl.style.display = 'none';
    overviewEl.style.display = 'none';

    // Fast path: View 기반 서버 집계 (소량 데이터만 전송)
    const [overviewStats, personaStats, dailyTrend, cron, gameConfigs, healthChecks, nruRuns] = await Promise.all([
      fetchOverviewStats(), fetchPersonaStats(), fetchDailyTrend(),
      fetchCronHistory(), fetchGameConfigs(), fetchHealthChecks(), fetchNruRuns()
    ]);
    _gameConfigs = gameConfigs;
    _nruRuns = nruRuns;
    _lastFetchTime = new Date().toISOString();

    const games = buildOverviewFromViews(overviewStats, personaStats, dailyTrend);
    _overviewGames = games;
    renderOverview(games);
    renderNruSummary(nruRuns);
    renderHealthCheck(healthChecks);
    renderCronHistory(cron);
    renderGameTabs(Object.keys(games));
    updateSidebarBadges();
    restoreGridCols();

    document.getElementById('update-time').textContent = '갱신: ' + new Date().toLocaleString('ko');
    loadingEl.style.display = 'none';
    overviewEl.style.display = 'block';

    // Realtime 구독 시작
    subscribeRealtime();

    // Background: runs fetch (런 관리자 + 이슈 카운트 + 게임 상세 탭용)
    fetchRuns().then(runs => {
      _allRuns = runs;
      renderRunManager(runs);
      // 이슈 카운트 업데이트
      for (const r of runs) {
        const issues = ((r.metrics || {}).issues || []);
        if (issues.length && _overviewGames[r.game_id]) {
          _overviewGames[r.game_id].issueCount += issues.length;
          if (!_overviewGames[r.game_id].issueDetails) _overviewGames[r.game_id].issueDetails = [];
          for (const iss of issues) _overviewGames[r.game_id].issueDetails.push({ ...iss, run_date: r.run_date, persona: r.persona });
        }
      }
      updateIssueSummary(_overviewGames);
    }).catch(e => console.warn('runs 백그라운드 fetch 실패:', e.message));

  } catch (e) {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'flex';
    errorEl.innerHTML = `
      <div class="icon">⚠️</div>
      <div style="font-size:16px;font-weight:600;">데이터 로딩 실패</div>
      <div style="font-size:13px;">${e.message}</div>
      <button onclick="init()">재시도</button>
    `;
  }
}
