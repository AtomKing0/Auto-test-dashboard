let _editMode = false;
let _sortables = [];

function toggleEditMode() {
  _editMode = !_editMode;
  document.body.classList.toggle('edit-mode', _editMode);
  document.getElementById('editBar').classList.toggle('active', _editMode);
  document.getElementById('editBtn').style.background = _editMode ? '#3b82f6' : '';
  document.getElementById('editBtn').style.color = _editMode ? '#fff' : '';

  if (_editMode) {
    _initSortables();
    // 합치기 버튼 주입
    _injectMergeButtons(document.getElementById('overview-panel'));
    document.querySelectorAll('.cat-panel.active').forEach(p => _injectMergeButtons(p));
  } else {
    _destroySortables();
    _saveLayout();
  }
}

function _initSortables() {
  _destroySortables();
  _wrapSections(document.getElementById('overview-panel'));
  document.querySelectorAll('.cat-panel.active').forEach(p => _wrapSections(p));
  document.querySelectorAll('.layout-container').forEach(el => {
    _sortables.push(new Sortable(el, {
      handle: '.section-handle',
      animation: 150,
      ghostClass: 'sortable-ghost',
      onEnd: () => _saveLayout(),
    }));
  });
}

function _wrapSections(container) {
  if (!container || container.querySelector('.layout-container')) return;
  const children = [...container.children].filter(el => el.tagName !== 'STYLE');
  const wrapper = document.createElement('div');
  wrapper.className = 'layout-container';
  children.forEach((child, i) => {
    if (child.classList.contains('layout-section')) return;
    const section = document.createElement('div');
    const secId = child.id || `sec-${i}`;
    section.className = 'layout-section';
    section.dataset.sectionId = secId;
    section.innerHTML = `<div class="section-handle">☰ ${_getSectionLabel(child)}
      <span class="section-toggle" onclick="event.stopPropagation();toggleSection(this.closest('.layout-section'))">${child.classList.contains('hidden-section') ? '👁‍🗨 표시' : '👁 숨기기'}</span>
    </div>`;
    child.parentNode.insertBefore(section, child);
    section.appendChild(child);
    wrapper.appendChild(section);
    const saved = _getLayout();
    if (saved.hidden && saved.hidden.includes(secId)) {
      section.classList.add('hidden-section');
      section.querySelector('.section-toggle').textContent = '👁‍🗨 표시';
    }
  });
  container.appendChild(wrapper);
  _restoreOrder(wrapper);
}

function _getSectionLabel(el) {
  const h4 = el.querySelector('h4');
  if (h4) return h4.textContent.slice(0, 30);
  const cls = el.className || '';
  if (cls.includes('metric-row')) return '메트릭 카드';
  if (cls.includes('persona-grid')) return '페르소나 카드';
  if (cls.includes('chart-grid')) return '차트 영역';
  if (cls.includes('ov-summary')) return '요약 바';
  if (cls.includes('cards')) return '게임 카드';
  if (cls.includes('tbl-wrap')) return '테이블';
  return el.tagName.toLowerCase();
}

function toggleSection(sectionEl) {
  sectionEl.classList.toggle('hidden-section');
  const isHidden = sectionEl.classList.contains('hidden-section');
  sectionEl.querySelector('.section-toggle').textContent = isHidden ? '👁‍🗨 표시' : '👁 숨기기';
  _saveLayout();
}

function _getLayoutKey() {
  const activeTab = document.querySelector('#sidebar-games .sidebar-item.active');
  const tabId = activeTab ? (activeTab.id.replace('sidebar-tab-', '') || 'overview') : 'overview';
  const activeCat = document.querySelector('.cat-tab.active');
  const catId = activeCat ? activeCat.textContent.trim() : '';
  return `layout_${tabId}_${catId}`;
}

function _saveLayout() {
  document.querySelectorAll('.layout-container').forEach(container => {
    const order = [...container.children].map(s => s.dataset.sectionId).filter(Boolean);
    const hidden = [...container.children].filter(s => s.classList.contains('hidden-section')).map(s => s.dataset.sectionId);
    const key = _getLayoutKey();
    localStorage.setItem(key, JSON.stringify({ order, hidden }));
  });
}

function _getLayout() {
  try { return JSON.parse(localStorage.getItem(_getLayoutKey())) || {}; }
  catch { return {}; }
}

function _restoreOrder(container) {
  const saved = _getLayout();
  if (!saved.order) return;
  saved.order.forEach(secId => {
    const el = container.querySelector(`[data-section-id="${secId}"]`);
    if (el) container.appendChild(el);
  });
}

function _destroySortables() {
  _sortables.forEach(s => s.destroy());
  _sortables = [];
}

function resetLayout() {
  localStorage.removeItem(_getLayoutKey());
  localStorage.removeItem('dash_grid_cols');
  localStorage.removeItem('dash_merged_sections');
  document.querySelectorAll('.layout-section').forEach(s => {
    s.classList.remove('hidden-section');
    const toggle = s.querySelector('.section-toggle');
    if (toggle) toggle.textContent = '👁 숨기기';
  });
  _destroySortables();
  _initSortables();
}

/* ═══════════════════════════════════════════════════════
   사이드바
   ═══════════════════════════════════════════════════════ */

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main-area');
  const btn = document.getElementById('sidebarToggle');
  const collapsed = sidebar.classList.toggle('collapsed');
  main.classList.toggle('sidebar-collapsed', collapsed);
  btn.textContent = collapsed ? '»' : '«';
  localStorage.setItem('dash_sidebar_collapsed', collapsed ? '1' : '0');
}

function restoreSidebar() {
  const collapsed = localStorage.getItem('dash_sidebar_collapsed') === '1';
  if (collapsed) {
    document.getElementById('sidebar')?.classList.add('collapsed');
    document.getElementById('main-area')?.classList.add('sidebar-collapsed');
    const btn = document.getElementById('sidebarToggle');
    if (btn) btn.textContent = '»';
  }
  // 모바일: 768px 이하 자동 접힘
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar')?.classList.add('collapsed');
    document.getElementById('main-area')?.classList.add('sidebar-collapsed');
  }
}

function sidebarSystemNav(target) {
  const SYSTEM_TITLES = { health: 'Health Check', cron: '크론 이력', runs: '런 관리' };
  const sectionMap = { health: 'health-check-section', cron: 'cron-section', runs: 'run-manager' };

  // 모든 사이드바 active 초기화 (게임 + 시스템)
  document.querySelectorAll('#sidebar-games .sidebar-item').forEach(b => b.classList.remove('active'));
  ['sidebar-health','sidebar-cron','sidebar-runs'].forEach(id => {
    document.getElementById(id)?.classList.remove('active');
  });
  document.getElementById(`sidebar-${target}`)?.classList.add('active');

  // 페이지 제목
  const titleEl = document.getElementById('page-title');
  if (titleEl) titleEl.textContent = SYSTEM_TITLES[target] || '종합 현황';

  // overview 탭이 아닌 상태면 먼저 전환
  const overview = document.getElementById('overview-panel');
  const panels = document.getElementById('game-panels');
  const wasGameTab = overview && overview.style.display === 'none';
  if (wasGameTab) {
    overview.style.display = 'block';
    if (panels) panels.innerHTML = '';
    _currentGameId = '';
    _renderedCats = {};
  }

  // 해당 섹션으로 스크롤 (게임 탭에서 전환 시 더 긴 딜레이)
  const sectionId = sectionMap[target];
  if (sectionId) {
    setTimeout(() => {
      const el = document.getElementById(sectionId);
      if (el) {
        const topbarHeight = document.querySelector('.top-bar')?.offsetHeight || 48;
        const y = el.getBoundingClientRect().top + window.scrollY - topbarHeight - 12;
        window.scrollTo({ top: y, behavior: 'smooth' });
      } else {
        // 섹션이 아직 렌더링 안 된 경우 (런 관리는 백그라운드 fetch 후 생성)
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    }, wasGameTab ? 300 : 100);
  }
}

/* ── 사이드바 DB 미니바 업데이트 ── */
function updateSidebarDbMini(pct, barColor) {
  const mini = document.getElementById('sidebar-db-mini');
  const fill = document.getElementById('sidebar-db-fill');
  const pctEl = document.getElementById('sidebar-db-pct');
  if (!mini || !fill || !pctEl) return;
  mini.style.display = 'block';
  fill.style.width = pct + '%';
  fill.style.background = barColor;
  pctEl.textContent = pct.toFixed(1) + '%';
}

/* ═══════════════════════════════════════════════════════
   그리드 열 수 조절
   ═══════════════════════════════════════════════════════ */

function setGridCols(btn, gridId, cols) {
  const grid = document.getElementById(gridId);
  if (!grid) return;
  // 기존 grid-cols-N 클래스 제거
  grid.classList.remove('grid-cols-1','grid-cols-2','grid-cols-3','grid-cols-4');
  grid.classList.add(`grid-cols-${cols}`);
  // 버튼 active 상태
  btn.closest('.grid-col-selector').querySelectorAll('.grid-col-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // localStorage 저장
  const saved = _getGridColsSaved();
  saved[gridId] = cols;
  localStorage.setItem('dash_grid_cols', JSON.stringify(saved));
}

function setMetricCols(btn, rowId, cols) {
  const row = document.getElementById(rowId);
  if (!row) return;
  row.classList.remove('metric-cols-3','metric-cols-4','metric-cols-5','metric-cols-6');
  row.classList.add(`metric-cols-${cols}`);
  btn.closest('.grid-col-selector').querySelectorAll('.grid-col-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const saved = _getGridColsSaved();
  saved[rowId] = 'metric-' + cols;
  localStorage.setItem('dash_grid_cols', JSON.stringify(saved));
}

function _getGridColsSaved() {
  try { return JSON.parse(localStorage.getItem('dash_grid_cols')) || {}; }
  catch { return {}; }
}

function restoreGridCols() {
  const saved = _getGridColsSaved();
  for (const [id, val] of Object.entries(saved)) {
    const el = document.getElementById(id);
    if (!el) continue;
    if (typeof val === 'number' || (typeof val === 'string' && !val.startsWith('metric-'))) {
      el.classList.remove('grid-cols-1','grid-cols-2','grid-cols-3','grid-cols-4');
      el.classList.add(`grid-cols-${val}`);
      // 해당 셀렉터 버튼 active 복원
      const selector = el.previousElementSibling;
      if (selector && selector.classList.contains('grid-col-selector')) {
        selector.querySelectorAll('.grid-col-btn').forEach(b => {
          b.classList.toggle('active', parseInt(b.dataset.cols) === parseInt(val));
        });
      }
    } else if (typeof val === 'string' && val.startsWith('metric-')) {
      const cols = val.replace('metric-', '');
      el.classList.remove('metric-cols-3','metric-cols-4','metric-cols-5','metric-cols-6');
      el.classList.add(`metric-cols-${cols}`);
      const selector = el.previousElementSibling;
      if (selector && selector.classList.contains('grid-col-selector')) {
        selector.querySelectorAll('.grid-col-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.cols === cols);
        });
      }
    }
  }
}

/* 차트 그리드에 셀렉터 삽입 헬퍼 */
function _makeGridSelector(gridId, defaultCols, type) {
  const saved = _getGridColsSaved()[gridId];
  const activeCols = saved && !String(saved).startsWith('metric-') ? parseInt(saved) : defaultCols;
  if (type === 'chart') {
    return `<div class="grid-col-selector">
      <span class="grid-col-label">열:</span>
      ${[1,2,3,4].map(c => `<button class="grid-col-btn${c===activeCols?' active':''}" data-cols="${c}" onclick="setGridCols(this,'${gridId}',${c})">${c}열</button>`).join('')}
    </div>`;
  } else {
    const activeM = saved && String(saved).startsWith('metric-') ? saved.replace('metric-','') : String(defaultCols);
    return `<div class="grid-col-selector">
      <span class="grid-col-label">열:</span>
      ${[3,4,5,6].map(c => `<button class="grid-col-btn${String(c)===activeM?' active':''}" data-cols="${c}" onclick="setMetricCols(this,'${gridId}',${c})">${c}열</button>`).join('')}
    </div>`;
  }
}

/* ═══════════════════════════════════════════════════════
   섹션 합치기/분리
   ═══════════════════════════════════════════════════════ */

function _getMergedSaved() {
  try { return JSON.parse(localStorage.getItem('dash_merged_sections')) || []; }
  catch { return []; }
}

function _saveMergedState() {
  const merged = [];
  document.querySelectorAll('.merged-section[data-merge-ids]').forEach(m => {
    merged.push(m.dataset.mergeIds);
  });
  localStorage.setItem('dash_merged_sections', JSON.stringify(merged));
}

function mergeSections(btn) {
  // btn이 속한 layout-section 찾기
  const secA = btn.closest('.layout-section');
  if (!secA) return;
  const container = secA.parentElement;
  if (!container) return;

  // 다음 visible layout-section 찾기
  let secB = secA.nextElementSibling;
  while (secB && (secB.classList.contains('hidden-section') || !secB.classList.contains('layout-section'))) {
    secB = secB.nextElementSibling;
  }
  if (!secB) return;

  const idA = secA.dataset.sectionId;
  const idB = secB.dataset.sectionId;

  // 두 섹션의 실제 콘텐츠(section-handle 제외)
  const contentA = secA.querySelector(':scope > *:not(.section-handle)');
  const contentB = secB.querySelector(':scope > *:not(.section-handle)');
  if (!contentA || !contentB) return;

  // 합쳐진 섹션 생성
  const merged = document.createElement('div');
  merged.className = 'layout-section merged-section';
  merged.dataset.sectionId = idA;
  merged.dataset.mergeIds = `${idA}|${idB}`;
  merged.dataset.originalA = idA;
  merged.dataset.originalB = idB;

  const handle = document.createElement('div');
  handle.className = 'section-handle';
  handle.innerHTML = `☰ ${_getSectionLabel(contentA)} + ${_getSectionLabel(contentB)}
    <span class="section-toggle" onclick="event.stopPropagation();toggleSection(this.closest('.layout-section'))">${'👁 숨기기'}</span>
    <button class="merge-btn split-btn" onclick="event.stopPropagation();splitSection(this)" title="분리">✂ 분리</button>
  `;
  merged.appendChild(handle);

  // 같은 타입(chart-grid)이면 자식 병합
  const isChartA = contentA.classList.contains('chart-grid');
  const isChartB = contentB.classList.contains('chart-grid');
  if (isChartA && isChartB) {
    const mergedGrid = document.createElement('div');
    mergedGrid.className = 'chart-grid';
    [...contentA.children].forEach(c => mergedGrid.appendChild(c.cloneNode(true)));
    [...contentB.children].forEach(c => mergedGrid.appendChild(c.cloneNode(true)));
    merged.appendChild(mergedGrid);
  } else {
    // 다른 타입: 세로 쌓임 + 구분선
    const cloneA = contentA.cloneNode(true);
    const cloneB = contentB.cloneNode(true);
    const divider = document.createElement('div');
    divider.className = 'merged-divider';
    divider.textContent = '•';
    merged.appendChild(cloneA);
    merged.appendChild(divider);
    merged.appendChild(cloneB);
  }

  // 원본 두 섹션을 merged로 교체
  secA.dataset.mergedInto = 'true';
  secB.dataset.mergedInto = 'true';
  container.insertBefore(merged, secA);
  secA.remove();
  secB.remove();

  _saveMergedState();
}

function splitSection(btn) {
  const merged = btn.closest('.layout-section.merged-section');
  if (!merged) return;
  const container = merged.parentElement;
  if (!container) return;

  const idA = merged.dataset.originalA;
  const idB = merged.dataset.originalB;

  // 원본 섹션 복원: overview-panel을 재렌더하는 것이 가장 안전
  // 합치기는 overview만 지원하므로 overview 재렌더
  merged.remove();
  _saveMergedState();
  // overview 재렌더
  if (Object.keys(_overviewGames).length) {
    renderOverview(_overviewGames);
    if (_allRuns.length) renderRunManager(_allRuns);
    renderDbUsage();
  }
}

/* 편집 모드 진입 시 합치기 버튼 주입 */
function _injectMergeButtons(container) {
  if (!container) return;
  container.querySelectorAll('.layout-section').forEach(sec => {
    const handle = sec.querySelector('.section-handle');
    if (!handle) return;
    if (handle.querySelector('.merge-btn:not(.split-btn)')) return; // 이미 있음
    const mergeBtn = document.createElement('button');
    mergeBtn.className = 'merge-btn';
    mergeBtn.title = '아래 섹션과 합치기';
    mergeBtn.textContent = '🔗↓ 합치기';
    mergeBtn.onclick = (e) => { e.stopPropagation(); mergeSections(mergeBtn); };
    handle.appendChild(mergeBtn);
  });
}
</script>
