<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프리플레이 통합 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
:root {
  --bg-body: #0b1120;
  --bg-card: #0f1a2e;
  --bg-topbar: #0f1a2e;
  --border: #1e3a5f;
  --text-primary: #e2e8f0;
  --text-secondary: #c8d1da;
  --text-muted: #8b9bb0;
  --status-ok: #10b981;
  --status-warn: #f59e0b;
  --status-err: #ef4444;
  --fs-scale: 1;
}
[data-theme="light"] {
  --bg-body: #f8fafc;
  --bg-card: #ffffff;
  --bg-topbar: #ffffff;
  --border: #e2e8f0;
  --text-primary: #1e293b;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg-body);
  color: var(--text-primary);
  font-size: calc(14px * var(--fs-scale));
}
a { color: #60a5fa; text-decoration: none; }

/* ── Top Bar ── */
.top-bar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 16px;
  background: var(--bg-topbar);
  border-bottom: 1px solid var(--border);
}
.logo { font-weight: 700; font-size: calc(15px * var(--fs-scale)); white-space: nowrap; }
.gtab {
  padding: 6px 18px; border: 1.5px solid var(--gc, #3b82f6); border-radius: 20px;
  background: transparent; color: var(--gc, #3b82f6);
  font-size: calc(13px * var(--fs-scale)); font-weight: 600; cursor: pointer;
  transition: background .15s, color .15s; opacity: .55;
}
.gtab.active { background: var(--gc, #3b82f6); color: #fff; opacity: 1; }
.gtab:hover:not(.active) { opacity: .9; }
.ctrl-group { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.ctrl-btn {
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg-card); color: var(--text-secondary);
  font-size: calc(12px * var(--fs-scale)); font-weight: 600; cursor: pointer;
}
.ctrl-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }
.ts { font-size: calc(11px * var(--fs-scale)); color: var(--text-muted); white-space: nowrap; }

/* ── Content ── */
.content { padding: 16px; max-width: 1400px; margin: 0 auto; }
.ov-summary {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 18px; margin-bottom: 16px;
  font-size: calc(13px * var(--fs-scale)); color: var(--text-secondary);
}
.ov-summary b { color: var(--text-primary); }

/* ── Cards ── */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-bottom: 16px; }
.game-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px; border-left: 3px solid var(--gc, #3b82f6);
}
.game-card h3 { font-size: calc(16px * var(--fs-scale)); margin-bottom: 8px; }
.game-card .stat { display: flex; justify-content: space-between; padding: 4px 0; font-size: calc(13px * var(--fs-scale)); }
.game-card .stat-label { color: var(--text-muted); }
.game-card .stat-value { font-weight: 600; }

/* ── Charts ── */
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.chart-box {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px;
}
.chart-box h4 { font-size: calc(14px * var(--fs-scale)); margin-bottom: 12px; color: var(--text-secondary); }
.chart-box canvas { max-height: 300px; }

/* ── Table ── */
.tbl-wrap {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px; margin-bottom: 16px; overflow-x: auto;
}
.tbl-wrap h4 { font-size: calc(14px * var(--fs-scale)); margin-bottom: 12px; color: var(--text-secondary); }
table { width: 100%; border-collapse: collapse; font-size: calc(12px * var(--fs-scale)); }
th { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-weight: 600; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text-primary); }
td { padding: 8px; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
tr:hover td { background: rgba(59,130,246,.05); }

/* ── Loading/Error ── */
.state-msg {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 60vh; gap: 12px; color: var(--text-muted);
}
.state-msg .icon { font-size: 48px; opacity: .3; }
.state-msg button {
  margin-top: 8px; padding: 8px 20px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-card); color: var(--text-primary); cursor: pointer; font-size: 14px;
}

/* ── Game Detail ── */
.game-detail { display: none; }
.game-detail.active { display: block; }
.persona-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 16px; }
.persona-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
}
.persona-card h5 { font-size: calc(13px * var(--fs-scale)); margin-bottom: 6px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge-ok { background: rgba(16,185,129,.15); color: #10b981; }
.badge-warn { background: rgba(245,158,11,.15); color: #f59e0b; }
.badge-err { background: rgba(239,68,68,.15); color: #ef4444; }

/* ── Category Tabs ── */
.cat-tabs {
  display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border); padding-bottom: 8px;
}
.cat-tab {
  padding: 6px 14px; border: none; border-radius: 8px 8px 0 0;
  background: transparent; color: var(--text-muted);
  font-size: calc(13px * var(--fs-scale)); font-weight: 600; cursor: pointer;
  transition: background .15s, color .15s;
}
.cat-tab.active { background: var(--bg-card); color: var(--text-primary); border-bottom: 2px solid #3b82f6; }
.cat-tab:hover:not(.active) { color: var(--text-secondary); }
.cat-panel { display: none; }
.cat-panel.active { display: block; }

/* ── Metric Row ── */
.metric-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.metric-box {
  flex: 1; min-width: 180px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px;
}
.metric-box .label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.metric-box .value { font-size: 22px; font-weight: 700; }
.metric-box .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* ── Security ── */
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.check-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
  font-size: calc(12px * var(--fs-scale));
}
.check-pass { color: var(--status-ok); }
.check-fail { color: var(--status-err); font-weight: 600; }

/* ── Perf ── */
.perf-gauge { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.gauge-box {
  flex: 1; min-width: 200px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px;
}
.gauge-bar { height: 8px; border-radius: 4px; background: var(--border); margin-top: 8px; overflow: hidden; }
.gauge-fill { height: 100%; border-radius: 4px; transition: width .3s; }

/* ── Run Manager ── */
.rm-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 12px; }
.rm-row:hover { background: rgba(59,130,246,.05); }
.rm-row input[type="checkbox"] { cursor: pointer; }
.rm-date-filter { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; font-size: 12px; }
.rm-date-filter input[type="date"] { padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card); color: var(--text-secondary); font-size: 12px; }
.rm-actions { display: flex; gap: 8px; margin-top: 10px; }
.rm-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-card); color: var(--text-secondary); font-size: 12px; cursor: pointer; }
.rm-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); }
.rm-btn-danger { border-color: #ef4444; color: #ef4444; }
.rm-btn-danger:hover { background: #ef444422; }

/* ── Layout Editor ── */
.edit-mode .layout-section {
  border: 2px dashed var(--border); border-radius: 8px; padding: 4px; margin-bottom: 8px;
  cursor: grab; position: relative;
}
.edit-mode .layout-section:active { cursor: grabbing; }
.edit-mode .layout-section .section-handle {
  display: flex; align-items: center; gap: 6px; padding: 4px 8px;
  background: rgba(59,130,246,.1); border-radius: 6px; margin-bottom: 4px;
  font-size: 11px; color: var(--text-muted); cursor: grab;
}
.section-handle { display: none; }
.edit-mode .section-toggle {
  display: inline-block; margin-left: auto; cursor: pointer;
  padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600;
  border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary);
}
.section-toggle { display: none; }
.layout-section.hidden-section > *:not(.section-handle) { display: none; }
.layout-section.hidden-section { opacity: 0.4; }
.sortable-ghost { opacity: 0.3; }
.edit-bar {
  display: none; padding: 8px 16px; background: rgba(59,130,246,.08);
  border-bottom: 1px solid var(--border); font-size: 12px;
  align-items: center; gap: 8px; color: var(--text-secondary);
}
.edit-bar.active { display: flex; }

/* ── Difficulty Color Coding ── */
.diff-normal { color: var(--status-ok); }
.diff-hard { color: var(--status-warn); }
.diff-superhard { color: var(--status-err); }

/* ── Gauge Bar (Perf) ── */
.leak-gauge { height: 24px; border-radius: 6px; background: var(--border); overflow: hidden; position: relative; margin: 8px 0; }
.leak-gauge-fill { height: 100%; border-radius: 6px; transition: width .3s; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; }

/* ── Toast ── */
.toast-container {
  position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 200;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.toast {
  padding: 12px 24px; border-radius: 10px;
  background: #1d4ed8; border: 1px solid #3b82f6;
  color: #fff; font-size: 14px; font-weight: 600;
  box-shadow: 0 6px 20px rgba(29,78,216,.4);
  animation: toastIn .3s ease;
  white-space: nowrap;
}
.toast.fade-out { animation: toastOut .3s ease forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }

/* ── Realtime Indicator ── */
.rt-indicator {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--text-muted); margin-left: 8px;
}
.rt-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--status-err);
  transition: background .3s;
}
.rt-dot.connected { background: var(--status-ok); }

/* ── DB Usage Bar ── */
.db-usage-bar {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 18px; margin-bottom: 16px;
}
.db-usage-track { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin-top: 6px; }
.db-usage-fill { height: 100%; border-radius: 4px; transition: width .3s; }

@media (max-width: 768px) {
  .cards { grid-template-columns: 1fr; }
  .chart-grid { grid-template-columns: 1fr; }
  .persona-grid { grid-template-columns: 1fr 1fr; }
}

/* ── Sidebar ── */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; z-index: 200;
  width: 220px;
  background: var(--bg-topbar);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: width 0.25s ease;
  overflow: hidden;
}
.sidebar.collapsed { width: 52px; }

.sidebar-header {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; min-height: 48px;
}
.sidebar-logo {
  font-weight: 700; font-size: 14px; white-space: nowrap;
  overflow: hidden; transition: opacity 0.2s;
}
.sidebar.collapsed .sidebar-logo { opacity: 0; pointer-events: none; }
.sidebar-toggle {
  margin-left: auto; flex-shrink: 0;
  background: none; border: 1px solid var(--border); border-radius: 4px;
  color: var(--text-muted); cursor: pointer; font-size: 12px;
  padding: 2px 6px; line-height: 1.4;
}
.sidebar-toggle:hover { color: var(--text-primary); }

.sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.sidebar-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--text-muted); padding: 8px 14px 4px;
  text-transform: uppercase; white-space: nowrap;
  transition: opacity 0.2s;
}
.sidebar.collapsed .sidebar-section-label { opacity: 0; height: 0; padding: 0; overflow: hidden; }

.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; cursor: pointer;
  border-left: 3px solid transparent;
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap; position: relative;
}
.sidebar-item:hover { background: rgba(59,130,246,.08); }
.sidebar-item.active {
  border-left-color: #3b82f6;
  background: rgba(59,130,246,.12);
  color: var(--text-primary);
}
.sidebar-item-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
.sidebar-item-text { font-size: 13px; font-weight: 500; overflow: hidden; transition: opacity 0.2s; }
.sidebar.collapsed .sidebar-item-text { opacity: 0; pointer-events: none; }
.sidebar-badge {
  margin-left: auto; background: rgba(59,130,246,.2); color: #60a5fa;
  font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px;
  flex-shrink: 0; transition: opacity 0.2s;
}
.sidebar.collapsed .sidebar-badge { opacity: 0; }

.sidebar-footer {
  border-top: 1px solid var(--border);
  padding: 8px 10px; flex-shrink: 0;
}
.sidebar-rt {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--text-muted);
  padding: 4px 0; white-space: nowrap;
}
.sidebar.collapsed .sidebar-rt-label { opacity: 0; }
.sidebar-db-mini {
  margin-top: 6px; transition: opacity 0.2s;
}
.sidebar.collapsed .sidebar-db-mini { opacity: 0; pointer-events: none; height: 0; overflow: hidden; margin: 0; }
.sidebar-db-mini-label {
  display: flex; justify-content: space-between;
  font-size: 10px; color: var(--text-muted); margin-bottom: 3px;
}
.sidebar-db-mini-track { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
.sidebar-db-mini-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }

/* Main layout shift */
.page-wrapper {
  display: flex; min-height: 100vh;
}
.main-area {
  flex: 1;
  margin-left: 220px;
  transition: margin-left 0.25s ease;
  min-width: 0;
}
.main-area.sidebar-collapsed { margin-left: 52px; }

/* Top bar without game tabs */
.top-bar { position: sticky; top: 0; z-index: 100; }
.page-title {
  font-size: 14px; font-weight: 600; color: var(--text-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 300px;
}

/* ── Grid Column Selector ── */
.grid-cols-1 { grid-template-columns: 1fr !important; }
.grid-cols-2 { grid-template-columns: 1fr 1fr !important; }
.grid-cols-3 { grid-template-columns: 1fr 1fr 1fr !important; }
.grid-cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr !important; }
.metric-cols-3 { flex-wrap: wrap; }
.metric-cols-3 .metric-box { flex: 0 0 calc(33.333% - 8px) !important; min-width: unset; }
.metric-cols-4 .metric-box { flex: 0 0 calc(25% - 9px) !important; min-width: unset; }
.metric-cols-5 .metric-box { flex: 0 0 calc(20% - 10px) !important; min-width: unset; }
.metric-cols-6 .metric-box { flex: 0 0 calc(16.666% - 10px) !important; min-width: unset; }

.grid-col-selector {
  display: none;
  gap: 4px; margin-bottom: 8px; align-items: center;
}
body.edit-mode .grid-col-selector { display: flex; }
.grid-col-btn {
  padding: 2px 8px; border: 1px solid var(--border); border-radius: 4px;
  background: var(--bg-card); color: var(--text-muted);
  font-size: 10px; font-weight: 600; cursor: pointer;
}
.grid-col-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
.grid-col-btn:hover:not(.active) { color: var(--text-primary); }
.grid-col-label { font-size: 10px; color: var(--text-muted); margin-right: 2px; }

/* ── Section Merge ── */
.merge-btn {
  display: none;
  padding: 2px 7px; border: 1px solid var(--border); border-radius: 4px;
  background: var(--bg-card); color: var(--text-muted);
  font-size: 10px; cursor: pointer; margin-left: 4px;
}
body.edit-mode .merge-btn { display: inline-block; }
.merge-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }
.merge-btn.split-btn { border-color: #f59e0b; color: #f59e0b; }
.merge-btn.split-btn:hover { background: rgba(245,158,11,.1); }

.merged-section {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; margin-bottom: 16px;
}
.merged-divider {
  text-align: center; color: var(--text-muted); font-size: 12px;
  padding: 6px 0; margin: 6px 0;
  border-top: 1px solid var(--border);
}

@media (max-width: 768px) {
  .sidebar { width: 52px; }
  .sidebar-logo, .sidebar-item-text, .sidebar-badge, .sidebar-section-label { opacity: 0 !important; pointer-events: none; }
  .sidebar-db-mini { opacity: 0; height: 0; overflow: hidden; margin: 0; }
  .main-area { margin-left: 52px; }
}
</style>
</head>
<body>
<div class="page-wrapper">
  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">🎮 통합 대시보드</span>
      <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="사이드바 접기">«</button>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <div class="sidebar-section-label">Games</div>
      <div id="sidebar-games">
        <!-- renderGameTabs()에서 동적 생성 -->
      </div>
      <div class="sidebar-section-label" style="margin-top:8px">System</div>
      <div class="sidebar-item" onclick="sidebarSystemNav('health')" id="sidebar-health" title="Health Check">
        <span class="sidebar-item-icon">🏥</span>
        <span class="sidebar-item-text">Health Check</span>
      </div>
      <div class="sidebar-item" onclick="sidebarSystemNav('cron')" id="sidebar-cron" title="크론 이력">
        <span class="sidebar-item-icon">⏰</span>
        <span class="sidebar-item-text">크론 이력</span>
      </div>
      <div class="sidebar-item" onclick="sidebarSystemNav('runs')" id="sidebar-runs" title="런 관리">
        <span class="sidebar-item-icon">🗂</span>
        <span class="sidebar-item-text">런 관리</span>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-rt">
        <span class="rt-dot" id="rt-dot"></span>
        <span class="sidebar-rt-label" id="rt-label">오프라인</span>
      </div>
      <div class="sidebar-db-mini" id="sidebar-db-mini" style="display:none">
        <div class="sidebar-db-mini-label">
          <span>DB</span><span id="sidebar-db-pct">-</span>
        </div>
        <div class="sidebar-db-mini-track">
          <div class="sidebar-db-mini-fill" id="sidebar-db-fill" style="width:0%;background:var(--status-ok)"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ── Main Area ── -->
  <div class="main-area" id="main-area">
    <div class="top-bar">
      <span class="page-title" id="page-title">종합 현황</span>
      <div class="ctrl-group">
        <button class="ctrl-btn" onclick="changeFontSize(-1)" title="글자 축소">A-</button>
        <button class="ctrl-btn" onclick="changeFontSize(1)" title="글자 확대">A+</button>
        <button class="ctrl-btn" id="themeBtn" onclick="toggleTheme()" title="테마 전환">☀</button>
        <button class="ctrl-btn" onclick="downloadCSV()" title="CSV 다운로드">CSV</button>
        <button class="ctrl-btn" id="editBtn" onclick="toggleEditMode()" title="레이아웃 편집">Edit</button>

<script>
/* ═══════════════════════════════════════════════════════

/* ── Chart.js 글로벌 다크 테마 설정 ── */
Chart.defaults.color = '#94a3b8';
Chart.defaults.borderColor = '#1e3a5f';

const SUPABASE_URL = 'https://lxkvjwnhrqbtaglwkgmf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_d_sWb1OmWgs0oKrWPCxr5g_ARo_7kq7';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PERSONA_ORDER = ['hardcore', 'average', 'casual', 'struggling'];
const PERSONA_KO = { hardcore: '고수', average: '중수', casual: '하수', struggling: '초보' };
const PERSONA_COLORS = { hardcore: '#3b82f6', average: '#10b981', casual: '#f59e0b', struggling: '#ef4444' };
function _sortPersona(entries) { return entries.sort(([a],[b]) => (PERSONA_ORDER.indexOf(a)===-1?99:PERSONA_ORDER.indexOf(a)) - (PERSONA_ORDER.indexOf(b)===-1?99:PERSONA_ORDER.indexOf(b))); }
const DIFF_TIERS = { 1: '튜토리얼', 2: '노말', 3: '하드', 4: '슈퍼하드' };
const DIFF_COLORS = { 1: '#10b981', 2: '#10b981', 3: '#f59e0b', 4: '#ef4444' };

let _allRuns = [];
let _nruRuns = [];
let _charts = {};
let _gameConfigs = [];
let _overviewGames = {};
let _lastFetchTime = '';

/* ── 데이터 Fetch ── */

async function fetchRuns() {

/* ── View 기반 서버 집계 Fetch ── */

async function fetchOverviewStats() {
  const { data, error } = await sb.from('v_overview_stats').select('*');
  if (error) throw error;
  return data || [];
}

async function fetchPersonaStats() {
  const { data, error } = await sb.from('v_persona_stats').select('*');
  if (error) throw error;
  return data || [];
}

async function fetchDailyTrend() {
  const { data, error } = await sb.from('v_daily_trend').select('*').order('run_date', { ascending: false });
  if (error) throw error;
  return data || [];
}

async function fetchDbUsage() {
  const { data, error } = await sb.rpc('get_db_usage');
  if (error) { console.warn('get_db_usage 실패:', error.message); return []; }
  return data || [];
}

function buildOverviewFromViews(overviewStats, personaStats, dailyTrend) {
  const games = {};
  for (const o of overviewStats) {
    games[o.game_id] = {
      runs: Number(o.total_runs) || 0,
      levels: Number(o.total_levels) || 0,
      time: Number(o.total_time_sec) || 0,
      personas: {},
      dailyMap: {},
      issueCount: 0,
      events: [],
    };
  }
  for (const p of personaStats) {
    if (!games[p.game_id]) continue;
    games[p.game_id].personas[p.persona] = {
      played: Number(p.levels_played) || 0,
      runs: Number(p.runs) || 0,
      lastDate: p.last_run_date || '',
    };
  }
  for (const d of dailyTrend) {
    if (!games[d.game_id]) continue;
    games[d.game_id].dailyMap[d.run_date] = {
      levels: Number(d.levels_played) || 0,
      runs: Number(d.runs) || 0,
    };
  }
  return games;
}

async function fetchCronHistory() {
  const { data, error } = await sb
    .from('cron_history')

  const { data, error } = await sb

  return data || [];

async function fetchNruRuns() {
  const { data, error } = await sb
    .from('nru_runs')
    .select('*')
    .order('run_date', { ascending: false })
    .order('created_at', { ascending: false })
    .limit(100);
  if (error) { console.warn('nru_runs 조회 실패:', error.message); return []; }
  return data || [];
}

/* ── 집계 ── */

function aggregateOverview(runs) {
  const games = {};
  for (const r of runs) {
    if (!games[r.game_id]) {
      games[r.game_id] = { runs: 0, levels: 0, time: 0, personas: {}, dailyMap: {}, issueCount: 0, issueDetails: [], events: [] };
    }
    const g = games[r.game_id];
    g.runs++;
    g.levels += r.levels_played || 0;
    g.time += r.total_time_sec || 0;

    const p = r.persona;
    if (!g.personas[p]) g.personas[p] = { played: 0, runs: 0, lastDate: '' };
    g.personas[p].played += r.levels_played || 0;
    g.personas[p].runs++;
    if (r.run_date > g.personas[p].lastDate) g.personas[p].lastDate = r.run_date;

    const d = r.run_date;
    if (!g.dailyMap[d]) g.dailyMap[d] = { levels: 0, runs: 0 };
    g.dailyMap[d].levels += r.levels_played || 0;
    g.dailyMap[d].runs++;

    const m = r.metrics || {};
    const runIssues = m.issues || [];
    g.issueCount += runIssues.length;
    for (const iss of runIssues) g.issueDetails.push({ ...iss, run_date: r.run_date, persona: r.persona });
  }
  return games;
}


/* ── 이슈 요약 렌더 공통 함수 ── */
const _ISSUE_TYPE_KR = {
  zero_reward: '보상 0',
  zero_turns_clear: '턴 0 클리어',
  missing_stage_id: '스테이지ID 없음',
  missing_difficulty: '난이도 없음',
  missing_card_data: '카드 데이터 없음',
  zero_entry_fee: '입장료 0',
  gold_flow_anomaly: '골드 흐름 불일치',
  suspiciously_fast: '비정상 빠른 클리어',
  gimmick_residue: '기믹 잔상',
};
const _SEV_KR = { high: '심각', medium: '주의', low: '관찰' };
const _SEV_COLOR = { high: 'var(--status-err)', medium: 'var(--status-warn)', low: 'var(--text-muted)' };
const _SEV_BG = { high: 'rgba(239,68,68,.12)', medium: 'rgba(245,158,11,.12)', low: 'rgba(148,163,184,.10)' };

function _renderIssueSummaryContent(games) {
  return Object.entries(games).map(([gid, g]) => {
    const color = g.issueCount > 0 ? 'var(--status-warn)' : 'var(--status-ok)';
    const text = g.issueCount > 0 ? `${g.issueCount}건` : '이슈 없음';
    const allIssues = g.issueDetails || [];
    // severity 요약 카운트
    const sevCounts = { high: 0, medium: 0, low: 0 };
    allIssues.forEach(iss => { sevCounts[iss.severity] = (sevCounts[iss.severity] || 0) + 1; });
    const sevBadges = ['high', 'medium', 'low']
      .filter(s => sevCounts[s] > 0)
      .map(s => `<span style="display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;background:${_SEV_BG[s]};color:${_SEV_COLOR[s]};font-weight:500">${_SEV_KR[s]} ${sevCounts[s]}</span>`)
      .join(' ');
    // 최근 20건까지 표시 (기존 10건에서 확대)
    const shown = allIssues.slice(-20);
    const details = shown.map(iss => {
      const typeKr = _ISSUE_TYPE_KR[iss.type] || iss.type;
      const sevCol = _SEV_COLOR[iss.severity] || 'var(--text-muted)';
      const sevLabel = _SEV_KR[iss.severity] || iss.severity;
      const persona = iss.persona ? (({'hardcore':'고수','average':'중수','casual':'하수','struggling':'초보'})[iss.persona] || iss.persona) : '';
      return `<div style="display:flex;align-items:center;gap:6px;padding:3px 0 3px 16px;font-size:11px;color:var(--text-secondary)">
        <span style="display:inline-block;padding:0 5px;border-radius:6px;font-size:9px;background:${_SEV_BG[iss.severity]||'transparent'};color:${sevCol};font-weight:600;min-width:28px;text-align:center">${sevLabel}</span>
        <span style="font-weight:600;min-width:90px;color:var(--text-primary)">${typeKr}</span>
        <span style="color:var(--text-secondary);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(iss.description||'').replace(/"/g,'&quot;')}">${iss.description || ''}</span>
        <span style="font-size:10px;color:var(--text-muted);white-space:nowrap;min-width:80px;text-align:right">${(iss.run_date||'').slice(5)} ${persona}</span>
      </div>`;
    }).join('');
    const hiddenCount = allIssues.length - shown.length;
    const moreHint = hiddenCount > 0 ? `<div style="padding:2px 0 2px 16px;font-size:10px;color:var(--text-muted)">... 외 ${hiddenCount}건 (최근 20건만 표시)</div>` : '';
    // 토글: 이슈 있으면 접기/펼치기
    const toggleId = `iss-toggle-${gid}`;
    if (g.issueCount === 0) {
      return `<div style="border-bottom:1px solid var(--border);">
        <div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;">
          <span style="font-weight:600;min-width:40px;">${gid}</span>
          <span style="color:${color}">${text}</span>
        </div>
      </div>`;
    }
    return `<div style="border-bottom:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;cursor:pointer;user-select:none" onclick="(function(){var d=document.getElementById('${toggleId}');if(d){d.style.display=d.style.display==='none'?'block':'none';var a=this.querySelector('.iss-arrow');if(a)a.innerHTML=d.style.display==='none'?'&#9654;':'&#9660;'}}).call(this)">
        <span style="font-weight:600;min-width:40px;">${gid}</span>
        <span style="color:${color};font-weight:500">${text}</span>
        ${sevBadges}
        <span class="iss-arrow" style="margin-left:auto;font-size:10px;color:var(--text-muted)">&#9654;</span>
      </div>
      <div id="${toggleId}" style="display:none;padding-bottom:4px" class="hc-foldable">
        ${details}${moreHint}
      </div>
    </div>`;
  }).join('');
}

/* ── 렌더링: 종합 탭 ── */

function renderOverview(games) {
  const panel = document.getElementById('overview-panel');
  const totalLevels = Object.values(games).reduce((a, g) => a + g.levels, 0);
  const totalRuns = Object.values(games).reduce((a, g) => a + g.runs, 0);
  const totalTime = Object.values(games).reduce((a, g) => a + g.time, 0);
  const timeStr = totalTime >= 3600
    ? `${(totalTime / 3600).toFixed(1)}시간`
    : `${Math.round(totalTime / 60)}분`;

  panel.innerHTML = `
    <div class="ov-summary">
      <b>전체 현황</b> &nbsp;·&nbsp;
      게임 <b>${Object.keys(games).length}종</b> &nbsp;·&nbsp;
      총 런 <b>${totalRuns}</b> &nbsp;·&nbsp;
      총 판 <b>${totalLevels.toLocaleString()}</b> &nbsp;·&nbsp;
      총 <b>${timeStr}</b>
    </div>
    <div class="cards">${Object.entries(games).map(([gid, g]) => renderGameCard(gid, g)).join('')}</div>
    ${_makeGridSelector('ov-chart-grid-main', 2, 'chart')}
    <div class="chart-grid" id="ov-chart-grid-main">
      <div class="chart-box"><h4>게임별 판당 평균 시간</h4><canvas id="chart-avg-time"></canvas></div>
      <div class="chart-box"><h4>일별 런 수 추이</h4><canvas id="chart-daily-runs"></canvas></div>
    </div>
    <div class="tbl-wrap"><h4>이슈 요약 (총 ${Object.values(games).reduce((a,g) => a + g.issueCount, 0)}건)</h4>
      ${_renderIssueSummaryContent(games)}
    </div>
    <div class="tbl-wrap"><h4>테스트 커버리지</h4>
      ${Object.entries(games).map(([gid, g]) => {
        const pList = Object.entries(g.personas).sort(([a],[b]) => (PERSONA_ORDER.indexOf(a)===-1?99:PERSONA_ORDER.indexOf(a)) - (PERSONA_ORDER.indexOf(b)===-1?99:PERSONA_ORDER.indexOf(b)))
          .map(([p, d]) => `${PERSONA_KO[p]||p} ${d.runs}`).join(' / ');
        const lastDate = Object.values(g.personas).reduce((mx, d) => d.lastDate > mx ? d.lastDate : mx, '');
        return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;">
          <span style="font-weight:600;min-width:40px;">${gid}</span>
          <span style="color:var(--text-secondary)">${g.runs}런 (${pList})</span>
          <span style="color:var(--text-muted);margin-left:auto">최근 ${lastDate ? lastDate.slice(5) : '-'}</span>
        </div>`;
      }).join('')}
    </div>
    <div id="nru-section"></div>
    <div id="health-check-section"></div>
    <div id="cron-section"></div>
    <div id="run-manager"></div>
    <div id="db-usage-section"></div>
  `;
  panel.style.display = 'block';
  if (_allRuns.length) renderRunManager(_allRuns);
  if (_nruRuns.length) { renderNruSummary(_nruRuns); renderNruManager(); }
  renderDbUsage();

  renderAvgTimeChart(games);
  renderDailyRunsChart(games);
}

function renderAvgTimeChart(games) {
  const gameIds = Object.keys(games);
  const colors = gameIds.map((_, i) => Object.values(PERSONA_COLORS)[i % 4]);
  const data = gameIds.map(gid => {
    const g = games[gid];
    return g.levels ? +(g.time / g.levels).toFixed(1) : 0;
  });
  if (_charts.avgTime) _charts.avgTime.destroy();
  _charts.avgTime = new Chart(document.getElementById('chart-avg-time'), {
    type: 'bar',
    data: {
      labels: gameIds,
      datasets: [{ label: '판당 평균 시간 (초)', data, backgroundColor: colors.map(c => c + '99'), borderColor: colors, borderWidth: 1.5, borderRadius: 6 }],
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.raw.toFixed(1) + '초' } } },
      scales: { x: { ticks: { callback: v => v + 's' } } },
    },
  });
}

function renderDailyRunsChart(games) {
  const allDates = new Set();
  Object.values(games).forEach(g => Object.keys(g.dailyMap).forEach(d => allDates.add(d)));
  const dates = [...allDates].sort();
  const gameIds = Object.keys(games);

  const datasets = gameIds.map((gid, i) => ({
    label: gid,
    data: dates.map(d => {
      const dd = games[gid].dailyMap[d];
      return dd ? dd.runs : 0;
    }),
    borderColor: Object.values(PERSONA_COLORS)[i % 4],
    tension: 0.3, fill: false, spanGaps: true,
  }));

  if (_charts.dailyRuns) _charts.dailyRuns.destroy();
  _charts.dailyRuns = new Chart(document.getElementById('chart-daily-runs'), {
    type: 'line',
    data: { labels: dates.map(d => d.slice(5)), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { y: { beginAtZero: true } },
      plugins: { legend: { labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary') } } },
    },
  });
}

function renderGameCard(gid, g) {
  const timeStr = g.time >= 3600
    ? `${(g.time / 3600).toFixed(1)}시간`
    : `${Math.round(g.time / 60)}분`;

  const personaRows = Object.entries(g.personas)
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([p, d]) => {
      return `<div class="stat"><span class="stat-label">${PERSONA_KO[p] || p}</span><span class="stat-value">${d.played}판 (${d.runs}런)</span></div>`;
    }).join('');

  return `
    <div class="game-card" style="--gc:${PERSONA_COLORS.hardcore}">
      <h3>${gid}</h3>
      <div class="stat"><span class="stat-label">총 런/판</span><span class="stat-value">${g.runs}런 / ${g.levels.toLocaleString()}판</span></div>
      <div class="stat"><span class="stat-label">소요시간</span><span class="stat-value">${timeStr}</span></div>
      ${personaRows}
    </div>
  `;
}

/* ── NRU 요약 ── */

function renderNruSummary(nruRuns) {
  const section = document.getElementById('nru-section');
  if (!section) return;
  if (!nruRuns || !nruRuns.length) {
    section.innerHTML = `
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:24px 18px;margin-bottom:16px;text-align:center;">
        <div style="font-size:13px;color:var(--text-muted);">NRU 테스트 데이터가 없습니다</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">run_nru.py 실행 후 자동 적재됩니다</div>
      </div>`;
    return;
  }

  // 최근 10건
  const recent = nruRuns.slice(0, 10);
  const latest = recent[0];
  const passCount = recent.filter(r => r.ready).length;
  const passRate = Math.round(passCount / recent.length * 100);
  const avgLevels = (recent.reduce((a, r) => a + (r.levels_cleared || 0), 0) / recent.length).toFixed(1);
  const avgTime = (recent.reduce((a, r) => a + (r.total_time_sec || 0), 0) / recent.length);
  const avgTimeStr = avgTime >= 60 ? `${(avgTime / 60).toFixed(1)}분` : `${Math.round(avgTime)}초`;
  const avgRetries = (recent.reduce((a, r) => a + (r.total_retries || 0), 0) / recent.length).toFixed(1);

  // 최신 결과 상태
  const latestStatus = latest.ready;
  const statusColor = latestStatus ? 'var(--status-ok)' : 'var(--status-err)';
  const statusLabel = latestStatus ? 'PASS' : 'FAIL';
  const statusBg = latestStatus ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)';

  // 최근 10건 추이 도트
  const trendDots = recent.slice().reverse().map(r => {
    const col = r.ready ? 'var(--status-ok)' : 'var(--status-err)';
    const d = (r.run_date || '').slice(5);
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:1px" title="${r.run_date} ${r.run_time || ''}&#10;Lv${r.levels_cleared}/${r.total_levels || 24}">
      <div style="width:14px;height:14px;border-radius:3px;background:${col}"></div>
      <span style="font-size:8px;color:var(--text-muted)">${d}</span>
    </div>`;
  }).join('');

  // 레벨별 진행 차트 (최신 런)
  const levelResults = latest.level_results || [];
  const levelBars = levelResults.map(lv => {
    const ok = lv.success;
    const col = ok ? (lv.retries > 0 ? '#f59e0b' : '#10b981') : '#ef4444';
    const h = Math.min(100, Math.max(15, (lv.duration_s || 0) * 2.5));
    const title = `Lv${lv.level}: ${ok ? '성공' : '실패'} ${lv.duration_s}s, ${lv.turns}턴, 재시도${lv.retries || 0}`;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;min-width:12px" title="${title}">
      <div style="width:100%;height:${h}px;background:${col};border-radius:2px;min-height:4px"></div>
      <span style="font-size:8px;color:var(--text-muted)">${lv.level}</span>
    </div>`;
  }).join('');

  // 최근 실행 테이블
  const rows = recent.map(r => {
    const passStyle = r.ready
      ? 'color:var(--status-ok);font-weight:600'
      : 'color:var(--status-err);font-weight:600';
    const failInfo = r.ready ? '' : ` (Lv${r.failed_level || '?'})`;
    const timeStr = (r.total_time_sec || 0) >= 60
      ? `${((r.total_time_sec || 0) / 60).toFixed(1)}분`
      : `${Math.round(r.total_time_sec || 0)}초`;
    return `<tr>
      <td><input type="checkbox" class="nru-ov-check" value="${r.id}"></td>
      <td>${(r.run_date || '').slice(5)}</td>
      <td>${r.run_time || '-'}</td>
      <td style="${passStyle}">${r.ready ? 'PASS' : 'FAIL'}${failInfo}</td>
      <td>${r.levels_cleared}/${r.total_levels || 24}</td>
      <td>${timeStr}</td>
      <td>${r.total_retries || 0}</td>
      <td>${(r.gold || 0).toLocaleString()}</td>
    </tr>`;
  }).join('');

  section.innerHTML = `
    <div style="margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap">
        <span style="font-weight:700;font-size:14px;">NRU 튜토리얼 테스트</span>
        <span style="font-size:11px;padding:2px 10px;border-radius:10px;background:${statusBg};color:${statusColor};font-weight:600">최신 ${statusLabel}</span>
        <span style="font-size:11px;color:var(--text-muted)">최근 ${recent.length}회 통과율 ${passRate}%</span>
        <span style="font-size:10px;color:var(--text-muted);margin-left:auto">${latest.run_date || ''} ${latest.run_time || ''}</span>
      </div>

      <!-- 메트릭 카드 -->
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        <div style="flex:1;min-width:130px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px">
          <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">통과율 (최근 ${recent.length}회)</div>
          <div style="font-size:22px;font-weight:700;color:${passRate >= 80 ? 'var(--status-ok)' : passRate >= 50 ? 'var(--status-warn)' : 'var(--status-err)'}">${passRate}%</div>
        </div>
        <div style="flex:1;min-width:130px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px">
          <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">평균 클리어 레벨</div>
          <div style="font-size:22px;font-weight:700">${avgLevels}<span style="font-size:12px;color:var(--text-muted)">/24</span></div>
        </div>
        <div style="flex:1;min-width:130px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px">
          <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">평균 소요 시간</div>
          <div style="font-size:22px;font-weight:700">${avgTimeStr}</div>
        </div>
        <div style="flex:1;min-width:130px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px">
          <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">평균 재시도</div>
          <div style="font-size:22px;font-weight:700">${avgRetries}<span style="font-size:12px;color:var(--text-muted)">회</span></div>
        </div>
      </div>

      <!-- 추이 + 레벨 진행 -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
        <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px">
          <h4 style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">최근 실행 추이</h4>
          <div style="display:flex;gap:6px;align-items:flex-end;justify-content:center">${trendDots}</div>
        </div>
        <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px">
          <h4 style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">최신 런 레벨별 소요시간</h4>
          <div style="display:flex;gap:2px;align-items:flex-end;height:100px;padding:0 4px">${levelBars}</div>
          <div style="display:flex;gap:10px;margin-top:6px;font-size:10px;color:var(--text-muted);justify-content:center">
            <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#10b981;margin-right:3px"></span>성공</span>
            <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#f59e0b;margin-right:3px"></span>재시도 후 성공</span>
            <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#ef4444;margin-right:3px"></span>실패</span>
          </div>
        </div>
      </div>

      <!-- 실행 이력 테이블 -->
      <div class="tbl-wrap" style="margin-bottom:0">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <h4 style="margin:0">최근 NRU 실행 이력</h4>
          <label style="font-size:11px;color:var(--text-muted);margin-left:auto"><input type="checkbox" onclick="document.querySelectorAll('.nru-ov-check').forEach(c=>c.checked=this.checked)"> 전체 선택</label>
          <button class="rm-btn rm-btn-danger" onclick="deleteSelectedNruOv()" style="font-size:11px;padding:3px 10px">선택 삭제</button>
          <span id="nru-ov-status" style="font-size:11px;color:var(--text-muted)"></span>
        </div>
        <table>
          <thead><tr><th style="width:30px"></th><th>날짜</th><th>시간</th><th>결과</th><th>레벨</th><th>소요</th><th>재시도</th><th>골드</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

/* ── Health Check ── */

function renderHealthCheck(checks) {
  const section = document.getElementById('health-check-section');
  if (!section) return;
  if (!checks || !checks.length) {
    section.innerHTML = `
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:24px 18px;margin-bottom:16px;text-align:center;">
        <div style="font-size:13px;color:var(--text-muted);">Health Check 데이터가 없습니다</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">프리플레이 실행 후 자동 생성됩니다</div>
      </div>`;
    return;
  }

  // 폐기된 체크 항목 필터 (과거 Supabase 데이터 호환)
  const DEPRECATED_CHECKS = new Set(['CLEAR_RATE', 'CONSECUTIVE_FAIL', 'STAGE_TIMEOUT']);

  // 게임별 + 날짜별 그룹핑 (폐기 항목 제외)
  const byGame = {};
  for (const c of checks) {
    if (DEPRECATED_CHECKS.has(c.check_id)) continue;
    if (!byGame[c.game_id]) byGame[c.game_id] = {};
    if (!byGame[c.game_id][c.run_date]) byGame[c.game_id][c.run_date] = [];
    byGame[c.game_id][c.run_date].push(c);
  }

  const STATUS_DOT = {
    PASS: { bg: 'var(--status-ok)', label: '통과' },
    FAIL: { bg: 'var(--status-err)', label: '실패' },
    WARN: { bg: 'var(--status-warn)', label: '주의' },
    SKIP: { bg: 'var(--text-muted)', label: '미실행' },
  };

  // 체크 항목 정의: 카테고리 + 사람이 읽을 수 있는 이름 + 설명 + 중요도 라벨
  const CHECK_META = {
    GAME_LOOP:      { cat: 'game', name: '게임 루프',    desc: '레벨이 정상 플레이되는지 확인',                   imp: '필수', impColor: '#dc2626' },
    API_ERROR:      { cat: 'stability', name: 'API 에러', desc: '콘솔 에러/경고 발생 여부 (게임 영향 없을 수 있음)', imp: '관찰', impColor: '#0d9488' },
    PERF_HEAP:      { cat: 'perf', name: '메모리(힙)',    desc: '힙 사용량 500MB 초과 여부',                     imp: '참고', impColor: '#6366f1' },
    PERF_DOM:       { cat: 'perf', name: 'DOM 노드',     desc: 'DOM 노드 10,000개 초과 여부',                   imp: '참고', impColor: '#6366f1' },
    TIMEOUT:        { cat: 'stability', name: '타임아웃', desc: '스테이지 300초 초과 여부',                      imp: '중요', impColor: '#d97706' },
    SECURITY:       { cat: 'stability', name: '보안 등급', desc: '보안 스캔 결과 (F=치명적)',                     imp: '중요', impColor: '#d97706' },
    GOLD_INTEGRITY: { cat: 'game', name: '골드 정합성',   desc: '시작 골드 + 스테이지 합 = 종료 골드',            imp: '필수', impColor: '#dc2626' },
    BETTING_UNLOCK: { cat: 'game', name: '베팅 해금',     desc: '해금 레벨 이전 사용 여부 (x2=Lv10, x3=Lv25, x5=Lv50)', imp: '중요', impColor: '#d97706' },
    MATCH3_VALID:   { cat: 'game', name: '3매치 유효',    desc: '매치 0% 스테이지 감지',                         imp: '필수', impColor: '#dc2626' },
    SLOTFULL:       { cat: 'perf', name: '슬롯풀',       desc: '슬롯풀 카운트 정상 여부',                       imp: '참고', impColor: '#6366f1' },
  };

  // 측정값 포맷터
  function formatValue(checkId, val) {
    if (!val || typeof val !== 'object') return '';
    switch (checkId) {
      case 'GAME_LOOP': return val.played != null ? `${val.played}판 플레이` : '';
      case 'API_ERROR': {
        const parts = [];
        if (val.error_count) parts.push(`에러 ${val.error_count}`);
        if (val.warn_count) parts.push(`경고 ${val.warn_count}`);
        return parts.join(', ') || '이상 없음';
      }
      case 'PERF_HEAP': return val.heap_max_mb != null ? `${val.heap_max_mb}MB / 500MB` : '';
      case 'PERF_DOM': return val.dom_max != null ? `${val.dom_max.toLocaleString()} / 10,000` : '';
      case 'TIMEOUT': return val.count ? `${val.count}건 초과` : val.stage_count ? `${val.stage_count}스테이지 정상` : '';
      case 'SECURITY': return val.grade ? `등급 ${val.grade}` : '';
      case 'GOLD_INTEGRITY': {
        if (val.diff === 0) return `정합 일치`;
        return val.diff != null ? `차이 ${val.diff.toLocaleString()}G` : '';
      }
      case 'BETTING_UNLOCK': return val.violations ? `위반 ${val.violations.length}건` : '정상';
      case 'MATCH3_VALID': return val.stages ? `0% 매치: ${val.stages.length}건` : val.stage_count ? `${val.stage_count}스테이지 정상` : '';
      case 'SLOTFULL': return val.slotfull_count != null ? `${val.slotfull_count}회` : '';
      default: return '';
    }
  }

  // 진행바 생성 (측정값이 비율로 표현 가능한 항목)
  function miniBar(pct, color) {
    const p = Math.min(100, Math.max(0, pct));
    return `<div style="display:inline-flex;align-items:center;gap:6px;flex:1">
      <div style="flex:1;max-width:80px;height:4px;background:var(--border);border-radius:2px;overflow:hidden">
        <div style="height:100%;width:${p}%;background:${color};border-radius:2px"></div>
      </div>
      <span style="font-size:10px;color:var(--text-muted)">${Math.round(p)}%</span>
    </div>`;
  }

  // 측정값 + 진행바 포맷터
  function formatIssueValue(checkId, val, status) {
    if (!val || typeof val !== 'object') return '';
    const col = status === 'FAIL' ? 'var(--status-err)' : 'var(--status-warn)';
    switch (checkId) {
      case 'GAME_LOOP': return `<span>played=${val.played || 0}</span>`;
      case 'API_ERROR': {
        const parts = [];
        if (val.error_count) parts.push(`에러 ${val.error_count}건`);
        if (val.warn_count) parts.push(`경고 ${val.warn_count}건`);
        return `<span>${parts.join(', ')}</span>`;
      }
      case 'PERF_HEAP': return val.heap_max_mb != null ? `${miniBar(val.heap_max_mb / 500 * 100, col)}<span style="font-size:10px;color:var(--text-muted)">${val.heap_max_mb}MB</span>` : '';
      case 'PERF_DOM': return val.dom_max != null ? `${miniBar(val.dom_max / 10000 * 100, col)}<span style="font-size:10px;color:var(--text-muted)">${(val.dom_max/1000).toFixed(1)}K</span>` : '';
      case 'TIMEOUT': return val.count ? `<span>${val.count}건 초과</span>` : '';
      case 'SECURITY': return val.grade ? `<span>등급 ${val.grade}</span>` : '';
      case 'GOLD_INTEGRITY': return val.diff != null ? `<span>차이 ${val.diff.toLocaleString()}G</span>` : '';
      case 'BETTING_UNLOCK': return val.violations ? `<span>위반 ${val.violations.length}건</span>` : '';
      case 'MATCH3_VALID': return val.stages ? `<span>0% 매치 ${val.stages.length}건</span>` : '';
      case 'SLOTFULL': return val.slotfull_count != null ? `<span>${val.slotfull_count}회</span>` : '';
      default: return '';
    }
  }

  const DAYS_KR = ['일','월','화','수','목','금','토'];
  const gameIds = Object.keys(byGame).sort();

  // ── 게임별 데이터 수집 ──
  const gameData = gameIds.map(gid => {
    const dates = Object.keys(byGame[gid]).sort().reverse();
    const latestDate = dates[0];
    const latestChecks = byGame[gid][latestDate];
    const total = latestChecks.length;
    const pass = latestChecks.filter(c => c.status === 'PASS').length;
    const fail = latestChecks.filter(c => c.status === 'FAIL').length;
    const warn = latestChecks.filter(c => c.status === 'WARN').length;
    const skip = latestChecks.filter(c => c.status === 'SKIP').length;
    // 관찰 등급 WARN은 전체 상태 판정에서 제외
    const realWarn = latestChecks.filter(c => c.status === 'WARN' && (CHECK_META[c.check_id] || {}).imp !== '관찰').length;
    const overallStatus = fail > 0 ? 'FAIL' : realWarn > 0 ? 'WARN' : 'PASS';
    return { gid, dates, latestDate, latestChecks, total, pass, fail, warn, skip, overallStatus };
  });

  const STATUS_CONF = {
    PASS: { bg: 'rgba(16,185,129,0.1)', border: 'rgba(16,185,129,0.3)', text: '#10b981', label: '정상' },
    WARN: { bg: 'rgba(245,158,11,0.1)', border: 'rgba(245,158,11,0.3)', text: '#f59e0b', label: '주의' },
    FAIL: { bg: 'rgba(239,68,68,0.1)',  border: 'rgba(239,68,68,0.3)',  text: '#ef4444', label: '이상' },
  };

  // ── 상단 요약 바 ──
  const latestDateAll = gameData.map(g => g.latestDate).sort().reverse()[0] || '';
  const summaryPills = gameData.map(g => {
    const sc = STATUS_CONF[g.overallStatus];
    return `<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:10px;background:${sc.bg};color:${sc.text};font-size:11px;font-weight:600">${g.gid} ${sc.label}</span>`;
  }).join('');

  // ── 게임별 카드 (문제 있는 게임만) / 한 줄 요약 (ALL PASS) ──
  const allPassGames = [];
  const issueCards = [];

  for (const g of gameData) {
    const sc = STATUS_CONF[g.overallStatus];

    // 7일 추이 도트 (12px 사각 라운드 + 요일) — 관찰 등급 WARN은 주의 아닌 정상 취급
    const trendHtml = g.dates.slice(0, 7).reverse().map(d => {
      const dc = byGame[g.gid][d];
      const hasFail = dc.some(c => c.status === 'FAIL');
      const hasRealWarn = dc.some(c => c.status === 'WARN' && (CHECK_META[c.check_id] || {}).imp !== '관찰');
      const col = hasFail ? 'var(--status-err)' : hasRealWarn ? 'var(--status-warn)' : 'var(--status-ok)';
      const dayIdx = new Date(d + 'T00:00:00').getDay();
      const isToday = d === latestDateAll;
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:1px" title="${d}">
        <div style="width:12px;height:12px;border-radius:3px;background:${col};${isToday?'outline:2px solid var(--text-primary);outline-offset:1px;':''}"></div>
        <span style="font-size:8px;color:var(--text-muted)">${DAYS_KR[dayIdx]}</span>
      </div>`;
    }).join('');

    // 이슈 행 렌더 헬퍼 — 관찰 등급은 청록 스타일, 나머지는 빨강/주황
    function renderIssueRow(c) {
      const meta = CHECK_META[c.check_id] || { name: c.check_id, desc: '', imp: '참고', impColor: '#6366f1' };
      const isObserve = meta.imp === '관찰';
      const isFail = c.status === 'FAIL';
      let borderCol, bgCol, icon;
      if (isObserve) {
        borderCol = '#0d9488'; bgCol = 'rgba(13,148,136,0.06)'; icon = '\uD83D\uDD0D';
      } else if (isFail) {
        borderCol = 'var(--status-err)'; bgCol = 'rgba(239,68,68,0.06)'; icon = '\u274C';
      } else {
        borderCol = 'var(--status-warn)'; bgCol = 'rgba(245,158,11,0.06)'; icon = '\u26A0\uFE0F';
      }
      const valHtml = formatIssueValue(c.check_id, c.value, c.status);
      return `<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:${bgCol};border-left:3px solid ${borderCol};border-radius:4px;font-size:11px;" title="${meta.desc}">
        <span style="font-size:10px">${icon}</span>
        <span style="font-weight:600;color:var(--text-primary);min-width:70px">${meta.name}</span>
        <div style="display:flex;align-items:center;gap:6px;flex:1">${valHtml}</div>
        <span style="font-size:9px;padding:0 6px;border-radius:8px;border:1px solid ${meta.impColor}33;color:${meta.impColor}">${meta.imp}</span>
      </div>`;
    }

    // 상세 항목 리스트 (펼치기용)
    function renderDetailList(checks, id) {
      const rows = checks.map(c => {
        const meta = CHECK_META[c.check_id] || { name: c.check_id, desc: '' };
        const dot = STATUS_DOT[c.status] || STATUS_DOT.SKIP;
        const val = formatValue(c.check_id, c.value);
        return `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px" title="${meta.desc}">
          <div style="width:6px;height:6px;border-radius:50%;background:${dot.bg};flex-shrink:0"></div>
          <span style="min-width:70px;color:var(--text-primary)">${meta.name}</span>
          <span style="color:var(--text-muted);flex:1">${val}</span>
        </div>`;
      }).join('');
      return `<div id="${id}" style="display:none;margin-top:6px;padding:6px 8px;background:var(--bg-body);border-radius:6px" class="hc-foldable">${rows}</div>`;
    }

    if (g.overallStatus === 'PASS') {
      // ALL PASS → 한 줄 + 펼치기
      const foldId = `hc-pass-${g.gid}`;
      const skipNote = g.skip > 0 ? ` <span style="color:var(--text-muted);font-size:10px">· 미실행 ${g.skip}</span>` : '';
      const detailHtml = renderDetailList(g.latestChecks, foldId);
      allPassGames.push(`<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:8px;border-left:3px solid ${sc.text};">
        <div style="display:flex;align-items:center;gap:10px;padding:6px 12px;cursor:pointer;user-select:none" onclick="var el=document.getElementById('${foldId}');el.style.display=el.style.display==='none'?'block':'none';this.querySelector('.hc-arrow').textContent=el.style.display==='none'?'\u25B6':'\u25BC'">
          <span class="hc-arrow" style="font-size:9px;color:var(--text-muted)">\u25B6</span>
          <span style="font-weight:700;font-size:13px;min-width:32px">${g.gid}</span>
          <span style="font-size:11px;padding:1px 8px;border-radius:10px;background:${sc.bg};color:${sc.text};font-weight:600">${sc.label}</span>
          <span style="font-size:11px;color:var(--text-secondary)">${g.total}개 항목 모두 통과${skipNote}</span>
          <div style="margin-left:auto;display:flex;gap:3px">${trendHtml}</div>
        </div>
        <div style="padding:0 12px">${detailHtml}</div>
      </div>`);
    } else {
      // FAIL/WARN → 상세 카드
      // 관찰 등급과 일반 이슈 분리
      const issues = g.latestChecks.filter(c => c.status === 'FAIL' || c.status === 'WARN');
      const mainIssues = issues.filter(c => (CHECK_META[c.check_id] || {}).imp !== '관찰');
      const observeIssues = issues.filter(c => (CHECK_META[c.check_id] || {}).imp === '관찰');
      const mainRows = mainIssues.map(renderIssueRow).join('');
      const observeRows = observeIssues.map(renderIssueRow).join('');
      const observeBlock = observeRows ? `<div style="margin-top:6px"><div style="font-size:9px;color:#0d9488;margin-bottom:3px;font-weight:600">관찰 항목</div>${observeRows}</div>` : '';

      // 통과/미실행
      const countParts = [];
      if (g.pass) countParts.push(`<span style="color:var(--status-ok)">통과 ${g.pass}</span>`);
      if (g.skip) countParts.push(`<span style="color:var(--text-muted)">미실행 ${g.skip}</span>`);
      const countBlock = countParts.length ? `<div style="margin-top:6px;font-size:10px;display:flex;gap:8px">${countParts.join('')}</div>` : '';

      // 이슈 카드의 전체 상태 — 관찰만 있으면 주의가 아닌 관찰로 표시
      const hasRealIssue = mainIssues.length > 0;
      const summaryText = [];
      const realFail = mainIssues.filter(c => c.status === 'FAIL').length;
      const realWarn = mainIssues.filter(c => c.status === 'WARN').length;
      if (realFail) summaryText.push(`실패 ${realFail}`);
      if (realWarn) summaryText.push(`주의 ${realWarn}`);
      if (observeIssues.length) summaryText.push(`관찰 ${observeIssues.length}`);

      const issueFoldId = `hc-issue-${g.gid}`;
      issueCards.push(`<div style="background:var(--bg-card);border:1px solid ${sc.border};border-radius:10px;border-left:3px solid ${sc.text};">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none" onclick="var el=document.getElementById('${issueFoldId}');el.style.display=el.style.display==='none'?'block':'none';this.querySelector('.hc-arrow').textContent=el.style.display==='none'?'\u25B6':'\u25BC'">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="hc-arrow" style="font-size:9px;color:var(--text-muted)">\u25B6</span>
            <span style="font-weight:700;font-size:14px;">${g.gid}</span>
            <span style="font-size:10px;padding:1px 8px;border-radius:10px;background:${sc.bg};color:${sc.text};font-weight:600">${sc.label}</span>
            <span style="font-size:10px;color:var(--text-muted)">${summaryText.join(' · ')}</span>
          </div>
          <div style="display:flex;gap:3px">${trendHtml}</div>
        </div>
        <div id="${issueFoldId}" style="display:none;padding:0 14px 12px" class="hc-foldable">
          ${mainRows ? `<div style="display:flex;flex-direction:column;gap:4px">${mainRows}</div>` : ''}
          ${observeBlock}
          ${countBlock}
        </div>
      </div>`);
    }
  }

  const allPassBlock = allPassGames.length ? `<div style="display:flex;flex-direction:column;gap:6px">${allPassGames.join('')}</div>` : '';
  const issueBlock = issueCards.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:10px;margin-top:${allPassGames.length?'10px':'0'}">${issueCards.join('')}</div>` : '';

  section.innerHTML = `
    <div style="margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap">
        <span style="font-weight:700;font-size:14px;">Health Check</span>
        ${summaryPills}
        <button onclick="toggleAllHC()" id="hc-toggle-all-btn" style="margin-left:auto;padding:2px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text-secondary);font-size:11px;cursor:pointer;font-weight:500">전체 펼치기</button>
        <span style="font-size:10px;color:var(--text-muted)">${latestDateAll}</span>
      </div>
      ${allPassBlock}${issueBlock}
    </div>
  `;
}

/* ── Health Check 전체 접기/펼치기 ── */
function toggleAllHC() {
  const btn = document.getElementById('hc-toggle-all-btn');
  if (!btn) return;
  const expanding = btn.textContent.trim() === '전체 펼치기';
  // hc-foldable 클래스가 있는 모든 요소
  document.querySelectorAll('#health-check-section .hc-foldable').forEach(el => {
    el.style.display = expanding ? 'block' : 'none';
  });
  // 화살표 아이콘 동기화
  document.querySelectorAll('#health-check-section .hc-arrow').forEach(el => {
    el.textContent = expanding ? '\u25BC' : '\u25B6';
  });
  document.querySelectorAll('#health-check-section .iss-arrow').forEach(el => {
    el.innerHTML = expanding ? '&#9660;' : '&#9654;';
  });
  btn.textContent = expanding ? '전체 접기' : '전체 펼치기';
}

/* ── 크론 이력 ── */

function renderCronHistory(cron) {
  if (!cron || !cron.length) return;
  const section = document.getElementById('cron-section');

  // 모든 게임 ID 수집
  const gameIds = new Set();
  for (const c of cron) {
    for (const g of Object.keys(c.results || {})) gameIds.add(g);
  }
  const games = [...gameIds].sort();

  const gameHeaders = games.map(g => `<th>${g}</th>`).join('');
  const rows = cron.map(c => {
    const res = c.results || {};
    const startTime = c.started_at ? new Date(c.started_at).toLocaleTimeString('ko', {hour:'2-digit', minute:'2-digit'}) : '-';
    const endTime = c.finished_at ? new Date(c.finished_at).toLocaleTimeString('ko', {hour:'2-digit', minute:'2-digit'}) : '-';
    const gameCells = games.map(g => {
      const r = res[g];
      if (!r) return '<td style="color:var(--text-muted)">-</td>';
      const ok = r.exit_code === 0;
      const color = ok ? 'var(--status-ok)' : 'var(--status-err)';
      const label = ok ? 'OK' : `FAIL (${r.exit_code})`;
      return `<td style="color:${color}">${label}</td>`;
    }).join('');
    return `<tr>
      <td><input type="checkbox" class="cron-check" value="${c.id}"></td>
      <td>${c.run_date}</td>
      <td>${startTime}</td>
      <td>${endTime}</td>
      <td>${c.levels_target || '-'}</td>
      ${gameCells}
      <td>${c.duration_min || '-'}분</td>
    </tr>`;
  }).join('');

  section.innerHTML = `
    <div class="tbl-wrap">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <h4 style="margin:0">크론 실행 이력</h4>
        <label style="font-size:11px;color:var(--text-muted);margin-left:auto"><input type="checkbox" id="cron-select-all" onclick="document.querySelectorAll('.cron-check').forEach(c=>c.checked=this.checked)"> 전체 선택</label>
        <button class="rm-btn rm-btn-danger" onclick="deleteSelectedCron()" style="font-size:11px;padding:3px 10px">선택 삭제</button>
        <span id="cron-status" style="font-size:11px;color:var(--text-muted)"></span>
      </div>
      <table>
        <thead><tr><th style="width:30px"></th><th>날짜</th><th>시작</th><th>종료</th><th>목표</th>${gameHeaders}<th>소요</th></tr></thead>

/* ── 카테고리 전환 시 lazy 차트 렌더링에 사용할 캐시 ── */
let _currentGameStages = [];
let _currentGameRuns = [];
let _currentGameId = '';
let _renderedCats = {};

async function switchTab(id, _btn) {
  // 사이드바 active 동기화
  document.querySelectorAll('#sidebar-games .sidebar-item').forEach(b => b.classList.remove('active'));
  const activeItem = document.getElementById(`sidebar-tab-${id}`);
  if (activeItem) activeItem.classList.add('active');

  // 페이지 제목 업데이트
  const titleEl = document.getElementById('page-title');
  if (titleEl) {
    if (id === 'overview') {
      titleEl.textContent = '종합 현황';
    } else {
      const name = GAME_NAMES[id] || id;
      titleEl.textContent = `${id} — ${name}`;
    }
  }

  const overview = document.getElementById('overview-panel');
  const panels = document.getElementById('game-panels');

  if (id === 'overview') {
    overview.style.display = 'block';
    panels.innerHTML = '';
    _currentGameId = '';
    _renderedCats = {};
    return;
  }

  overview.style.display = 'none';
  panels.innerHTML = '<div class="state-msg"><div class="icon">⏳</div><div>게임 데이터 로딩 중...</div></div>';

  try {
    const stages = await fetchStages(id);
    const gameRuns = _allRuns.filter(r => r.game_id === id);
    _currentGameStages = stages;
    _currentGameRuns = gameRuns;
    _currentGameId = id;
    _renderedCats = {};
    panels.innerHTML = renderGameDetail(id, stages, gameRuns);
    // 요약 탭은 즉시 렌더
    setTimeout(() => {
      renderSummaryCharts(id, stages, gameRuns);
      renderRadarChart(id, stages, gameRuns);
      _renderedCats['summary'] = true;
    }, 50);
  } catch (e) {
    panels.innerHTML = `<div class="state-msg"><div class="icon">⚠️</div><div>${id} 데이터 로딩 실패: ${e.message}</div></div>`;
  }
}

/* ══════════════════════════════════════════════
   카테고리: NRU 튜토리얼 (SCJ)
   ══════════════════════════════════════════════ */
function renderCatNru(gameId) {
  const runs = _nruRuns.filter(r => r.game_id === gameId);
  if (!runs.length) return '<div style="color:var(--text-muted);padding:20px">NRU 데이터 없음. run_nru.py 실행 후 자동 적재됩니다.</div>';

  const latest = runs[0];
  const levelResults = latest.level_results || [];

  const passCount = runs.filter(r => r.ready).length;
  const passRate = Math.round(passCount / runs.length * 100);

  // 레벨별 통계 집계 (모든 런)
  const levelStats = {};
  for (const r of runs) {
    for (const lv of (r.level_results || [])) {
      if (!levelStats[lv.level]) levelStats[lv.level] = { total: 0, success: 0, totalTime: 0, totalRetries: 0, totalTurns: 0 };
      const s = levelStats[lv.level];
      s.total++;
      if (lv.success) s.success++;
      s.totalTime += lv.duration_s || 0;
      s.totalRetries += lv.retries || 0;
      s.totalTurns += lv.turns || 0;
    }
  }

  const levelRows = Object.entries(levelStats).sort(([a],[b]) => Number(a) - Number(b)).map(([lv, s]) => {
    const cr = Math.round(s.success / s.total * 100);
    const crColor = cr >= 100 ? 'var(--status-ok)' : cr >= 50 ? 'var(--status-warn)' : 'var(--status-err)';
    return `<tr>
      <td style="font-weight:600">Lv ${lv}</td>
      <td style="color:${crColor};font-weight:600">${cr}%</td>
      <td>${(s.totalTime / s.total).toFixed(1)}초</td>
      <td>${(s.totalTurns / s.total).toFixed(1)}</td>
      <td>${(s.totalRetries / s.total).toFixed(1)}</td>
      <td>${s.total}</td>
    </tr>`;
  }).join('');

  const latestRows = levelResults.map(lv => {
    const ok = lv.success;
    const statusColor = ok ? 'var(--status-ok)' : 'var(--status-err)';
    return `<tr>
      <td style="font-weight:600">Lv ${lv.level}</td>
      <td style="color:${statusColor};font-weight:600">${ok ? '성공' : '실패'}</td>
      <td>${(lv.duration_s || 0).toFixed(1)}초</td>
      <td>${lv.turns || 0}</td>
      <td>${lv.matches || 0}</td>
      <td>${lv.draws || 0}</td>
      <td>${lv.retries || 0}</td>
    </tr>`;
  }).join('');

  const historyRows = runs.slice(0, 20).map(r => {
    const passStyle = r.ready ? 'color:var(--status-ok);font-weight:600' : 'color:var(--status-err);font-weight:600';
    const timeStr = (r.total_time_sec || 0) >= 60 ? `${((r.total_time_sec || 0) / 60).toFixed(1)}분` : `${Math.round(r.total_time_sec || 0)}초`;
    return `<tr>
      <td><input type="checkbox" class="nru-cat-check" value="${r.id}"></td>
      <td>${(r.run_date || '').slice(5)}</td>
      <td>${r.run_time || '-'}</td>
      <td style="${passStyle}">${r.ready ? 'PASS' : 'FAIL'}</td>
      <td>${r.levels_cleared}/${r.total_levels || 24}</td>
      <td>${timeStr}</td>
      <td>${r.total_retries || 0}</td>
      <td>${(r.gold || 0).toLocaleString()}</td>
      <td>${r.hammer || 0}</td>
    </tr>`;
  }).join('');

  return `
    <div class="metric-row">
      <div class="metric-box">
        <div class="label">전체 통과율</div>
        <div class="value" style="color:${passRate >= 80 ? 'var(--status-ok)' : passRate >= 50 ? 'var(--status-warn)' : 'var(--status-err)'}">${passRate}%</div>
        <div class="sub">${passCount}/${runs.length}회 통과</div>
      </div>
      <div class="metric-box">
        <div class="label">평균 클리어</div>
        <div class="value">${(runs.reduce((a,r) => a + (r.levels_cleared||0), 0) / runs.length).toFixed(1)}<span style="font-size:12px;color:var(--text-muted)">/24</span></div>
      </div>
      <div class="metric-box">
        <div class="label">최신 결과</div>
        <div class="value" style="color:${latest.ready ? 'var(--status-ok)' : 'var(--status-err)'}">${latest.ready ? 'PASS' : 'FAIL'}</div>
        <div class="sub">${latest.run_date} ${latest.run_time || ''}</div>
      </div>
      <div class="metric-box">
        <div class="label">총 실행</div>
        <div class="value">${runs.length}<span style="font-size:12px;color:var(--text-muted)">회</span></div>
      </div>
    </div>
    <div class="tbl-wrap">
      <h4>레벨별 통계 (전체 ${runs.length}회 집계)</h4>
      <table>
        <thead><tr><th>레벨</th><th>클리어율</th><th>평균 시간</th><th>평균 턴</th><th>평균 재시도</th><th>시도 수</th></tr></thead>
        <tbody>${levelRows}</tbody>
      </table>
    </div>
    <div class="tbl-wrap">
      <h4>최신 런 레벨별 상세 (${latest.run_date} ${latest.run_time || ''})</h4>
      <table>
        <thead><tr><th>레벨</th><th>결과</th><th>시간</th><th>턴</th><th>매치</th><th>드로우</th><th>재시도</th></tr></thead>
        <tbody>${latestRows}</tbody>
      </table>
    </div>
    <div class="tbl-wrap">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <h4 style="margin:0">NRU 실행 이력 (최근 ${Math.min(20, runs.length)}회)</h4>
        <label style="font-size:11px;color:var(--text-muted);margin-left:auto"><input type="checkbox" onclick="document.querySelectorAll('.nru-cat-check').forEach(c=>c.checked=this.checked)"> 전체 선택</label>
        <button class="rm-btn rm-btn-danger" onclick="deleteSelectedNruCat('${gameId}')" style="font-size:11px;padding:3px 10px">선택 삭제</button>
        <span id="nru-cat-status" style="font-size:11px;color:var(--text-muted)"></span>
      </div>
      <table>
        <thead><tr><th style="width:30px"></th><th>날짜</th><th>시간</th><th>결과</th><th>레벨</th><th>소요</th><th>재시도</th><th>골드</th><th>해머</th></tr></thead>
        <tbody>${historyRows}</tbody>
      </table>
    </div>
  `;
}

/* ══════════════════════════════════════════════
   카테고리: 라운드 분석 (PBM)
   ══════════════════════════════════════════════ */
function renderCatRounds(gameId, stages, runs) {
  if (!stages.length) return '<div style="color:var(--text-muted);padding:20px">라운드 데이터 없음</div>';

  const pAgg = {};
  const allScores = [], allMoves = [];
  for (const s of stages) {
    const d = s.details || {};
    const score = d.score || 0, moves = d.moves || 0;
    allScores.push(score);
    allMoves.push(moves);
    const p = s.persona;
    if (!pAgg[p]) pAgg[p] = { scores: [], moves: [], count: 0 };
    pAgg[p].scores.push(score);
    pAgg[p].moves.push(moves);
    pAgg[p].count++;
  }

  const avgScore = allScores.length ? Math.round(allScores.reduce((a, v) => a + v, 0) / allScores.length) : 0;
  const maxScore = Math.max(0, ...allScores);
  const minScore = allScores.length ? Math.min(...allScores) : 0;
  const avgMoves = allMoves.length ? (allMoves.reduce((a, v) => a + v, 0) / allMoves.length).toFixed(1) : '-';
  const variance = allScores.length ? allScores.reduce((a, v) => a + (v - avgScore) ** 2, 0) / allScores.length : 0;
  const stdDev = Math.round(Math.sqrt(variance));

  const personaRows = _sortPersona(Object.entries(pAgg)).map(([p, d]) => {
    const pAvg = Math.round(d.scores.reduce((a, v) => a + v, 0) / d.count);
    const pMax = Math.max(...d.scores);
    const pAvgM = (d.moves.reduce((a, v) => a + v, 0) / d.count).toFixed(1);
    return `<tr>
      <td style="color:${PERSONA_COLORS[p] || '#999'};font-weight:600">${PERSONA_KO[p] || p}</td>
      <td>${d.count}</td><td>${pAvg.toLocaleString()}</td><td>${pMax.toLocaleString()}</td><td>${pAvgM}</td>
    </tr>`;
  }).join('');

  return `
    <div class="metric-row">
      <div class="metric-box"><div class="label">총 라운드</div><div class="value">${allScores.length}</div></div>
      <div class="metric-box"><div class="label">평균 점수</div><div class="value">${avgScore.toLocaleString()}</div></div>
      <div class="metric-box"><div class="label">최고 점수</div><div class="value">${maxScore.toLocaleString()}</div></div>
      <div class="metric-box"><div class="label">최저 점수</div><div class="value">${minScore.toLocaleString()}</div></div>
      <div class="metric-box"><div class="label">점수 표준편차</div><div class="value">${stdDev.toLocaleString()}</div></div>
      <div class="metric-box"><div class="label">평균 수</div><div class="value">${avgMoves}</div></div>
    </div>
    <div class="chart-grid">
      <div class="chart-box"><h4>점수 분포</h4><canvas id="chart-rounds-dist-${gameId}"></canvas></div>
      <div class="chart-box"><h4>점수 vs 수 상관관계</h4><canvas id="chart-rounds-scatter-${gameId}"></canvas></div>
    </div>
    <div class="chart-grid">
      <div class="chart-box"><h4>페르소나별 평균 점수</h4><canvas id="chart-rounds-persona-${gameId}"></canvas></div>
      <div class="chart-box"><h4>런별 점수 추이</h4><canvas id="chart-rounds-trend-${gameId}"></canvas></div>
    </div>
    <div class="tbl-wrap">
      <h4>페르소나별 라운드 요약</h4>
      <table><thead><tr><th>페르소나</th><th>라운드</th><th>평균 점수</th><th>최고 점수</th><th>평균 수</th></tr></thead>
      <tbody>${personaRows}</tbody></table>
    </div>
  `;
}

function renderRoundCharts(gameId, stages, runs) {
  if (!stages.length) return;
  const allScores = stages.map(s => (s.details || {}).score || 0);

  // 1) 점수 분포 히스토그램
  const maxS = Math.max(1, ...allScores);
  const bucketSize = Math.max(500, Math.ceil(maxS / 10 / 500) * 500);
  const buckets = {};
  for (const s of allScores) {
    const key = Math.floor(s / bucketSize) * bucketSize;
    buckets[key] = (buckets[key] || 0) + 1;
  }
  const sortedKeys = Object.keys(buckets).map(Number).sort((a, b) => a - b);

  const distKey = `rounds-dist-${gameId}`;
  if (_charts[distKey]) _charts[distKey].destroy();
  const distCanvas = document.getElementById(`chart-rounds-dist-${gameId}`);
  if (distCanvas) {
    _charts[distKey] = new Chart(distCanvas, {
      type: 'bar',
      data: {
        labels: sortedKeys.map(k => `${k}~${k + bucketSize - 1}`),
        datasets: [{ label: '라운드 수', data: sortedKeys.map(k => buckets[k]), backgroundColor: '#3b82f699', borderColor: '#3b82f6', borderWidth: 1, borderRadius: 4 }],
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { title: { display: true, text: '라운드 수' } } } },
    });
  }

  // 2) 점수 vs 수 스캐터
  const scatterKey = `rounds-scatter-${gameId}`;
  if (_charts[scatterKey]) _charts[scatterKey].destroy();
  const scatterCanvas = document.getElementById(`chart-rounds-scatter-${gameId}`);

    const pData = {};
    for (const s of stages) {
      const d = s.details || {}, p = s.persona;
      if (!pData[p]) pData[p] = [];
      pData[p].push({ x: d.moves || 0, y: d.score || 0 });
    }
    const datasets = _sortPersona(Object.entries(pData)).map(([p, pts]) => ({
      label: PERSONA_KO[p] || p, data: pts,
      backgroundColor: (PERSONA_COLORS[p] || '#999') + '99',
      borderColor: PERSONA_COLORS[p] || '#999', pointRadius: 4,
    }));
    _charts[scatterKey] = new Chart(scatterCanvas, {
      type: 'scatter', data: { datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { x: { title: { display: true, text: '수 (moves)' } }, y: { title: { display: true, text: '점수' } } },
        plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } },
      },
    });
  }

  // 3) 페르소나별 평균 점수
  const pKey = `rounds-persona-${gameId}`;
  if (_charts[pKey]) _charts[pKey].destroy();
  const pCanvas = document.getElementById(`chart-rounds-persona-${gameId}`);
  if (pCanvas) {
    const pAgg = {};
    for (const s of stages) { const p = s.persona, sc = (s.details || {}).score || 0; if (!pAgg[p]) pAgg[p] = { t: 0, n: 0 }; pAgg[p].t += sc; pAgg[p].n++; }
    const sorted = _sortPersona(Object.entries(pAgg));
    _charts[pKey] = new Chart(pCanvas, {
      type: 'bar',
      data: {
        labels: sorted.map(([p]) => PERSONA_KO[p] || p),
        datasets: [{ label: '평균 점수', data: sorted.map(([, d]) => Math.round(d.t / d.n)),
          backgroundColor: sorted.map(([p]) => (PERSONA_COLORS[p] || '#999') + '99'),
          borderColor: sorted.map(([p]) => PERSONA_COLORS[p] || '#999'), borderWidth: 1.5, borderRadius: 6 }],
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.raw.toLocaleString() + '점' } } } },
    });
  }

  // 4) 런별 점수 추이
  const tKey = `rounds-trend-${gameId}`;
  if (_charts[tKey]) _charts[tKey].destroy();
  const tCanvas = document.getElementById(`chart-rounds-trend-${gameId}`);
  if (tCanvas) {
    const pts = runs.filter(r => (r.metrics || {}).avg_score).map(r => ({
      label: (r.run_date || '').slice(5) + ' ' + ((r.source_path || '').split('/').pop() || '').replace('freeplay_', '').replace('.json', ''),
      score: r.metrics.avg_score,
    }));
    _charts[tKey] = new Chart(tCanvas, {
      type: 'line',
      data: {
        labels: pts.map(p => p.label),
        datasets: [{ label: '런 평균 점수', data: pts.map(p => p.score), borderColor: '#f59e0b', tension: 0.3, fill: false, pointRadius: 4 }],
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { maxRotation: 45 } } } },
    });
  }
}

function renderGameDetail(gameId, stages, runs) {
  const config = _gameConfigs.find(c => c.game_id === gameId);
  const cats = config ? config.config.categories : [{ id: 'summary', label: '📊 요약' }];

  const tabsHtml = cats.map((c, i) =>
    `<button class="cat-tab${i === 0 ? ' active' : ''}" onclick="switchCat('${gameId}','${c.id}',this)">${c.label}</button>`

  const panelsHtml = cats.map((c, i) => {
